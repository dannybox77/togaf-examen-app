<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOGAF 10 · Preparación Foundation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F1E8;
  --paper-2:#ECE7D9;
  --ink:#1E2B22;
  --ink-soft:#4B5A4F;
  --line:#C9C0A6;
  --line-strong:#9FB39A;
  --blue:#2E4C6D;
  --blue-soft:#DCE6EC;
  --green:#3C6E47;
  --green-soft:#DEEBDD;
  --rust:#A8442E;
  --rust-soft:#F3DFD7;
  --gold:#9C7A24;
  --gold-soft:#F1E7C9;
  --card:#FBF9F2;
  --radius:4px;
  --shadow:0 1px 0 rgba(30,43,34,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#161D18;
    --paper-2:#1D2620;
    --ink:#E9E7DC;
    --ink-soft:#AEB8AC;
    --line:#3A4238;
    --line-strong:#4E6350;
    --blue:#8FB2D6;
    --blue-soft:#233240;
    --green:#8FC79A;
    --green-soft:#22321F;
    --rust:#E39178;
    --rust-soft:#3A2420;
    --gold:#E0C271;
    --gold-soft:#3A3220;
    --card:#1C231D;
    --shadow:0 1px 0 rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --paper:#161D18;
  --paper-2:#1D2620;
  --ink:#E9E7DC;
  --ink-soft:#AEB8AC;
  --line:#3A4238;
  --line-strong:#4E6350;
  --blue:#8FB2D6;
  --blue-soft:#233240;
  --green:#8FC79A;
  --green-soft:#22321F;
  --rust:#E39178;
  --rust-soft:#3A2420;
  --gold:#E0C271;
  --gold-soft:#3A3220;
  --card:#1C231D;
  --shadow:0 1px 0 rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    linear-gradient(var(--line) 1px, transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/40px 40px,
    var(--paper);
  background-attachment:local;
  color:var(--ink);
  font-family:'IBM Plex Sans', system-ui, sans-serif;
  font-size:16px;
  line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
.serif{font-family:'Fraunces', serif;}
.mono{font-family:'IBM Plex Mono', monospace;}

#app{
  max-width:780px;
  margin:0 auto;
  padding:28px 20px 64px;
  min-height:100%;
}

/* ---------- top bar ---------- */
.topbar{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:28px;
  padding-bottom:14px;
  border-bottom:2px solid var(--ink);
}
.topbar .brand{
  display:flex;
  align-items:baseline;
  gap:10px;
  cursor:pointer;
}
.brand .mark{
  font-family:'IBM Plex Mono', monospace;
  font-weight:600;
  font-size:13px;
  border:1.5px solid var(--ink);
  border-radius:50%;
  width:30px;height:30px;
  display:inline-flex;align-items:center;justify-content:center;
  flex:none;
}
.brand h1{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:21px;
  margin:0;
  letter-spacing:-0.01em;
}
.brand .sub{
  font-size:12px;
  color:var(--ink-soft);
  font-family:'IBM Plex Mono', monospace;
}
.topbar-actions{
  display:flex;
  gap:8px;
  flex:none;
}
.theme-toggle{
  border:1px solid var(--line-strong);
  background:transparent;
  color:var(--ink-soft);
  border-radius:20px;
  padding:5px 12px;
  font-size:12px;
  font-family:'IBM Plex Mono', monospace;
  cursor:pointer;
}
.theme-toggle:hover{border-color:var(--ink);color:var(--ink);}

/* ---------- home ---------- */
.hero{margin-bottom:30px;}
.hero .kicker{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  color:var(--blue);
  margin-bottom:8px;
}
.hero h2{
  font-family:'Fraunces', serif;
  font-size:30px;
  font-weight:600;
  line-height:1.15;
  margin:0 0 10px;
  max-width:22ch;
}
.hero p{
  color:var(--ink-soft);
  max-width:52ch;
  margin:0;
}

.modes{display:flex;flex-direction:column;gap:14px;margin-bottom:30px;}
.mode-card{
  background:var(--card);
  border:1px solid var(--line);
  border-left:4px solid var(--blue);
  border-radius:var(--radius);
  padding:18px 18px;
  cursor:pointer;
  box-shadow:var(--shadow);
  display:flex;
  gap:16px;
  align-items:flex-start;
  transition:transform .12s ease, border-color .12s ease;
}
.mode-card:hover{transform:translateX(2px);}
.mode-card.green{border-left-color:var(--green);}
.mode-card.gold{border-left-color:var(--gold);}
.mode-card.ref{border-left-color:var(--ink-soft);}
.mode-card.purple{border-left-color:#7A5FA8;}
.mode-card .num{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  color:var(--ink-soft);
  width:38px;flex:none;
  padding-top:3px;
}
.mode-card .body h3{
  margin:0 0 4px;
  font-family:'Fraunces', serif;
  font-size:19px;
  font-weight:600;
}
.mode-card .body p{
  margin:0 0 8px;
  color:var(--ink-soft);
  font-size:14px;
}
.mode-card .meta{
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;
  color:var(--blue);
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}
.mode-card.green .meta{color:var(--green);}
.mode-card.gold .meta{color:var(--gold);}
.mode-card.ref .meta{color:var(--ink-soft);}
.mode-card.purple .meta{color:#7A5FA8;}

.history{
  border:1px dashed var(--line-strong);
  border-radius:var(--radius);
  padding:14px 16px;
  font-size:13px;
}
.history h4{
  margin:0 0 8px;
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;
  text-transform:none;
  color:var(--ink-soft);
  letter-spacing:.02em;
}
.history .row{
  display:flex;justify-content:space-between;
  padding:5px 0;
  border-top:1px solid var(--line);
}
.history .row:first-of-type{border-top:none;}
.history .empty{color:var(--ink-soft);font-style:italic;}

/* ---------- day select ---------- */
.daylist{display:flex;flex-direction:column;gap:8px;}
.day-row{
  display:flex;align-items:center;gap:14px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:12px 14px;
  cursor:pointer;
}
.day-row:hover{border-color:var(--ink-soft);}
.day-badge{
  font-family:'IBM Plex Mono', monospace;
  font-weight:600;
  font-size:13px;
  border:1.5px solid var(--ink);
  border-radius:50%;
  width:34px;height:34px;flex:none;
  display:flex;align-items:center;justify-content:center;
}
.day-row .dtitle{font-weight:600;font-size:14.5px;}
.day-row .dcount{font-size:12px;color:var(--ink-soft);font-family:'IBM Plex Mono', monospace;}
.day-row .dbest{margin-left:auto;font-family:'IBM Plex Mono', monospace;font-size:12px;color:var(--green);flex:none;text-align:right;}

.count-picker{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 26px;}
.count-picker button{
  font-family:'IBM Plex Mono', monospace;
  font-size:13px;
  padding:9px 16px;
  border-radius:20px;
  border:1.5px solid var(--line-strong);
  background:transparent;
  color:var(--ink);
  cursor:pointer;
}
.count-picker button:hover, .count-picker button.active{
  border-color:var(--blue);
  background:var(--blue-soft);
  color:var(--blue);
}

.back-link{
  display:inline-flex;align-items:center;gap:6px;
  font-family:'IBM Plex Mono', monospace;
  font-size:12.5px;color:var(--ink-soft);
  cursor:pointer;margin-bottom:18px;background:none;border:none;padding:0;
}
.back-link:hover{color:var(--ink);}

.section-title{
  font-family:'Fraunces', serif;
  font-size:22px;font-weight:600;margin:0 0 4px;
}
.section-desc{color:var(--ink-soft);font-size:14px;margin:0 0 18px;}

/* ---------- quiz ---------- */
.quiz-head{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;
}
.progress-wrap{flex:1;}
.progress-label{
  font-family:'IBM Plex Mono', monospace;font-size:12px;color:var(--ink-soft);
  display:flex;justify-content:space-between;margin-bottom:6px;
}
.progress-bar{height:6px;background:var(--paper-2);border:1px solid var(--line);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:var(--blue);}
.timer{
  font-family:'IBM Plex Mono', monospace;
  font-size:13px;font-weight:600;
  border:1.5px solid var(--line-strong);
  border-radius:20px;padding:6px 12px;flex:none;
  white-space:nowrap;
}
.timer.low{border-color:var(--rust);color:var(--rust);}

.qcard{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:22px 22px 20px;
  margin-bottom:16px;
}
.qcard .qtag{
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;color:var(--blue);margin-bottom:10px;
}
.qcard .qtext{
  font-family:'Fraunces', serif;
  font-size:19px;font-weight:500;line-height:1.4;margin:0 0 18px;
}
.options{display:flex;flex-direction:column;gap:9px;}
.opt{
  display:flex;align-items:flex-start;gap:12px;
  border:1.5px solid var(--line);
  border-radius:var(--radius);
  padding:12px 14px;
  cursor:pointer;
  font-size:14.5px;
  background:var(--paper);
}
.opt:hover{border-color:var(--ink-soft);}
.opt .letter{
  font-family:'IBM Plex Mono', monospace;font-weight:600;font-size:12.5px;
  border:1.5px solid var(--ink-soft);border-radius:50%;
  width:24px;height:24px;flex:none;
  display:flex;align-items:center;justify-content:center;
  margin-top:1px;
}
.opt.selected{border-color:var(--blue);background:var(--blue-soft);}
.opt.selected .letter{border-color:var(--blue);color:var(--blue);}
.opt.correct{border-color:var(--green);background:var(--green-soft);}
.opt.correct .letter{border-color:var(--green);background:var(--green);color:var(--card);}
.opt.incorrect{border-color:var(--rust);background:var(--rust-soft);}
.opt.incorrect .letter{border-color:var(--rust);background:var(--rust);color:var(--card);}
.opt.disabled{cursor:default;}

.feedback{
  margin-top:14px;padding:12px 14px;border-radius:var(--radius);font-size:13.5px;
}
.feedback.ok{background:var(--green-soft);color:var(--green);}
.feedback.bad{background:var(--rust-soft);color:var(--rust);}
.feedback b{font-family:'IBM Plex Mono', monospace;font-weight:600;}
.feedback .explain{color:var(--ink);opacity:.85;margin-top:4px;}

.quiz-actions{display:flex;justify-content:flex-end;gap:10px;}
.btn{
  font-family:'IBM Plex Mono', monospace;
  font-size:13px;font-weight:600;
  padding:11px 20px;border-radius:20px;border:1.5px solid var(--ink);
  background:var(--ink);color:var(--paper);cursor:pointer;
}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.ghost{background:transparent;color:var(--ink);}
.btn.ghost:hover{background:var(--paper-2);}
.btn:not(:disabled):hover{opacity:.85;}

/* ---------- results ---------- */
.score-wrap{
  display:flex;align-items:center;gap:22px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px 22px;margin-bottom:20px;
}
.score-ring{
  width:96px;height:96px;flex:none;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces', serif;font-weight:600;font-size:22px;
  border:6px solid var(--line);
}
.score-ring.pass{border-color:var(--green);color:var(--green);}
.score-ring.fail{border-color:var(--rust);color:var(--rust);}
.score-info h3{margin:0 0 4px;font-family:'Fraunces', serif;font-size:20px;}
.score-info p{margin:0;color:var(--ink-soft);font-size:13.5px;}
.score-info .pct{font-family:'IBM Plex Mono', monospace;font-size:12px;margin-top:6px;}

.review-list{display:flex;flex-direction:column;gap:10px;margin-bottom:22px;}
.review-item{
  border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;background:var(--card);
}
.review-item .rq{font-size:14px;font-weight:600;margin-bottom:8px;}
.review-item .ra{font-size:13px;margin-bottom:3px;}
.review-item .ra.correct{color:var(--green);}
.review-item .ra.wrong{color:var(--rust);text-decoration:line-through;}
.review-item .explain{font-size:12.5px;color:var(--ink-soft);margin-top:6px;}

.result-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}

footer.note{
  text-align:center;color:var(--ink-soft);font-size:12px;margin-top:36px;
  font-family:'IBM Plex Mono', monospace;
}

/* ---------- reference / chuleta ---------- */
.ref-section{
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--card);
  margin-bottom:10px;
  overflow:hidden;
}
.ref-head{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;cursor:pointer;
}
.ref-head .rbadge{
  font-family:'IBM Plex Mono', monospace;font-size:11px;font-weight:600;
  border:1.5px solid var(--ink-soft);border-radius:50%;
  width:28px;height:28px;flex:none;
  display:flex;align-items:center;justify-content:center;
}
.ref-head h3{margin:0;font-family:'Fraunces', serif;font-size:16.5px;font-weight:600;flex:1;}
.ref-head .chev{font-family:'IBM Plex Mono', monospace;color:var(--ink-soft);transition:transform .15s ease;flex:none;}
.ref-section.open .chev{transform:rotate(90deg);}
.ref-body{
  padding:0 18px 18px;
  display:none;
  font-size:13.5px;
}
.ref-section.open .ref-body{display:block;}
.ref-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
.ref-table th{
  text-align:left;font-family:'IBM Plex Mono', monospace;font-weight:600;font-size:11px;
  color:var(--ink-soft);padding:6px 8px;border-bottom:1.5px solid var(--line-strong);
}
.ref-table td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
.ref-table tr:last-child td{border-bottom:none;}
.ref-table td.rf-name{font-weight:600;white-space:nowrap;color:var(--blue);}
.ref-note{
  background:var(--paper-2);border-left:3px solid var(--gold);
  padding:10px 12px;border-radius:0 var(--radius) var(--radius) 0;
  margin-top:10px;font-size:13px;color:var(--ink-soft);
}
.ref-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
.ref-pill{
  border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:var(--paper);
}
.ref-pill .pt{font-family:'IBM Plex Mono', monospace;font-size:11px;color:var(--blue);margin-bottom:3px;}
@media (max-width:560px){ .ref-grid{grid-template-columns:1fr;} .ref-table{font-size:12px;} }

@media (max-width:520px){
  .hero h2{font-size:25px;}
  .score-wrap{flex-direction:column;text-align:center;}
  .qcard{padding:18px 16px;}
}
</style>
</head>

<script>
const EXAM_QUESTIONS = [{"id":1,"q":"Complete the sentence: The TOGAF Standard covers the development of four architecture domains, Application, Data, Technology, and …","options":["Business.","Capability.","Transformation.","Transition."],"correct":0,"explain":"The TOGAF Standard covers the development of four architecture domains: Application, Data, Technology, and Business.","qEs":"Complete la oración: El Estándar TOGAF cubre el desarrollo de cuatro dominios de arquitectura: Aplicación, Datos, Tecnología y …","optionsEs":["Negocio.","Capacidad.","Transformación.","Transición."],"explainEs":"El Estándar TOGAF cubre el desarrollo de cuatro dominios de arquitectura: Aplicación, Datos, Tecnología y Negocio."},{"id":2,"q":"Consider the following descriptions of deliverables consumed and produced across the TOGAF ADM cycle: 1) A summary of changes to the enterprise that will accrue from successful deployment of the Target Architecture. 2) The joint agreement between development partners and sponsors on the deliverables, quality, and fitness-for-purpose of an architecture. 3) A document sent from the sponsoring organization to the architecture organization to trigger the start of an architecture development cycle. 4) The deliverable container for the core architectural artifacts created during a project. Which deliverables match these descriptions?","options":["1-Architecture Vision, 2-Architecture Contract, 3-Request for Architecture Work, 4-Architecture Definition Document","1-Architecture Vision, 2-Request for Architecture Work, 3-Architecture Vision, 4-Architecture Definition Document","1-Change Request, 2-Architecture Contract, 3-Architecture Definition Document, 4-Request for Architecture Work","1-Request for Architecture Work, 2-Architecture Definition Document, 3-Architecture Contract, 4-Architecture Vision"],"correct":0,"explain":"","qEs":"Considere las siguientes descripciones de entregables consumidos y producidos a lo largo del ciclo ADM de TOGAF: 1) Un resumen de los cambios a la empresa que resultarán del despliegue exitoso de la Arquitectura Objetivo. 2) El acuerdo conjunto entre los socios de desarrollo y los patrocinadores sobre los entregables, calidad e idoneidad de una arquitectura. 3) Un documento enviado desde la organización patrocinadora a la organización de arquitectura para iniciar un ciclo de desarrollo de arquitectura. 4) El contenedor de entregables para los artefactos arquitectónicos centrales creados durante un proyecto. ¿Qué entregables corresponden a estas descripciones?","optionsEs":["1-Architecture Vision, 2-Architecture Contract, 3-Request for Architecture Work, 4-Architecture Definition Document","1-Architecture Vision, 2-Request for Architecture Work, 3-Architecture Vision, 4-Architecture Definition Document","1-Change Request, 2-Architecture Contract, 3-Architecture Definition Document, 4-Request for Architecture Work","1-Request for Architecture Work, 2-Architecture Definition Document, 3-Architecture Contract, 4-Architecture Vision"],"explainEs":""},{"id":3,"q":"Where is the practical guidance on how to apply the TOGAF Standard provided?","options":["The TOGAF Fundamental Content","The TOGAF Library","The TOGAF Series Guides","The ADM Techniques"],"correct":2,"explain":"The TOGAF Series Guides provide practical guidance on how to apply the TOGAF Standard.","qEs":"¿Dónde se ofrece la guía práctica sobre cómo aplicar el Estándar TOGAF?","optionsEs":["El TOGAF Fundamental Content","La TOGAF Library","Las TOGAF Series Guides","Las ADM Techniques"],"explainEs":"Las TOGAF Series Guides ofrecen guía práctica sobre cómo aplicar el Estándar TOGAF."},{"id":4,"q":"You have been asked to explain why Enterprise Architecture can be beneficial. Which of the following is the best answer?","options":["It guides the architects to make appropriate technology choices to maximize shareholder value.","It optimizes the enterprise business strategy making all components work together.","It provides a strategic context for the evolution of the enterprise in response to constantly changing needs.","It sets the range, scope, and scale of the changes defined by the strategy."],"correct":2,"explain":"Enterprise Architecture can be beneficial as it provides a strategic context for the evolution of the enterprise in response to constantly changing needs.","qEs":"Le pidieron explicar por qué la Enterprise Architecture puede ser beneficiosa. ¿Cuál de las siguientes es la mejor respuesta?","optionsEs":["Guía a los arquitectos para hacer elecciones tecnológicas apropiadas que maximicen el valor para los accionistas.","Optimiza la estrategia de negocio de la empresa haciendo que todos los componentes trabajen juntos.","Proporciona un contexto estratégico para la evolución de la empresa en respuesta a necesidades en constante cambio.","Establece el rango, alcance y escala de los cambios definidos por la estrategia."],"explainEs":"La Enterprise Architecture puede ser beneficiosa porque proporciona un contexto estratégico para la evolución de la empresa en respuesta a necesidades en constante cambio."},{"id":5,"q":"What is an objective of the Preliminary Phase?","options":["To develop the Architecture Vision document","To develop the Implementation and Migration Plan","To establish the Architecture Governance process","To operate the governance framework"],"correct":2,"explain":"","qEs":"¿Cuál es un objetivo de la Fase Preliminar (Preliminary Phase)?","optionsEs":["Desarrollar el documento Architecture Vision","Desarrollar el Implementation and Migration Plan","Establecer el proceso de Architecture Governance","Operar el marco de gobernanza"],"explainEs":""},{"id":6,"q":"Which of the following describes a purpose of Architecture Principles?","options":["To control the business in pursuit of strategic objectives","To describe likely impacts resulting from successful deployment of the Target Architecture","To form a contract between the sponsoring organization and the Enterprise Architect","To set precedence during trade-off discussions"],"correct":3,"explain":"","qEs":"¿Cuál de las siguientes describe un propósito de los Architecture Principles?","optionsEs":["Controlar el negocio en la búsqueda de objetivos estratégicos","Describir los impactos probables que resultarían del despliegue exitoso de la Arquitectura Objetivo","Formar un contrato entre la organización patrocinadora y el Enterprise Architect","Sentar precedente durante discusiones de trade-off (compensación entre opciones)"],"explainEs":""},{"id":7,"q":"Which of the following is a responsibility of an Architecture Board?","options":["Allocating resources for architecture projects","Conducting assessments of the maturity level of architecture discipline within the organization","Determining the scope of an architecture compliance review","Enforcement of architecture compliance"],"correct":3,"explain":"","qEs":"¿Cuál de las siguientes es una responsabilidad de un Architecture Board?","optionsEs":["Asignar recursos para proyectos de arquitectura","Realizar evaluaciones del nivel de madurez de la disciplina de arquitectura dentro de la organización","Determinar el alcance de una revisión de cumplimiento de arquitectura (compliance review)","Exigir el cumplimiento de la arquitectura (enforcement of architecture compliance)"],"explainEs":""},{"id":8,"q":"Which statement best applies to an Architecture Repository?","options":["A complete Architecture Repository is required to capture all artifacts listed in the TOGAF Standard.","A well-run Architecture Repository leads to the minimization of information gathered and maintained.","Agile organizations are not able to use an Architecture Repository.","An Architecture Repository contains materials that are only used by the Enterprise Architecture team."],"correct":1,"explain":"","qEs":"¿Cuál afirmación aplica mejor a un Architecture Repository?","optionsEs":["Se requiere un Architecture Repository completo para capturar todos los artefactos listados en el Estándar TOGAF.","Un Architecture Repository bien gestionado lleva a minimizar la información recopilada y mantenida.","Las organizaciones Agile no pueden usar un Architecture Repository.","Un Architecture Repository contiene materiales que solo usa el equipo de Enterprise Architecture."],"explainEs":""},{"id":9,"q":"What ADM phase includes obtaining approval for the Statement of Architecture Work?","options":["Preliminary Phase","Architecture Vision","Technology Architecture","Migration Planning"],"correct":1,"explain":"","qEs":"¿Qué fase del ADM incluye obtener la aprobación del Statement of Architecture Work?","optionsEs":["Preliminary Phase","Architecture Vision (Fase A)","Technology Architecture (Fase D)","Migration Planning (Fase F)"],"explainEs":""},{"id":10,"q":"Refer to the following table: Output & Outcome: An approved set of projects, containing the objective and any necessary constraints, resources required, and start and finish dates. Essential Knowledge: Resources available to undertake the change; how stakeholder priority and preference adjust in response to value, effort, and risk of change (Stakeholder Requirements). Which ADM phase(s) does this describe?","options":["Phase A","Phases B, C, and D","Phase E","Phase F"],"correct":3,"explain":"","qEs":"Consulte la siguiente tabla: Output & Outcome: Un conjunto aprobado de proyectos, con el objetivo y las restricciones necesarias, los recursos requeridos y las fechas de inicio y fin. Essential Knowledge: Recursos disponibles para emprender el cambio; cómo se ajustan la prioridad y preferencia de los stakeholders en respuesta al valor, esfuerzo y riesgo del cambio (Stakeholder Requirements). ¿Qué fase(s) del ADM describe esto?","optionsEs":["Fase A","Fases B, C y D","Fase E","Fase F"],"explainEs":""},{"id":11,"q":"Complete the sentence: A set of Architecture Principles that are enduring and yet able to accommodate change meet the recommended criteria of …","options":["Consistency.","Completeness.","Robustness.","Stability."],"correct":3,"explain":"","qEs":"Complete la oración: Un conjunto de Architecture Principles que sean duraderos y a la vez capaces de acomodar el cambio cumple con el criterio recomendado de …","optionsEs":["Consistencia.","Completitud.","Robustez.","Estabilidad."],"explainEs":""},{"id":12,"q":"Which of the following describes how the Enterprise Continuum is used when developing an Enterprise Architecture?","options":["To coordinate with the other management frameworks in use","To describe how an architecture addresses stakeholder concerns","To identify and understand business requirements","To structure re-usable architecture and solution assets"],"correct":3,"explain":"","qEs":"¿Cuál de las siguientes describe cómo se usa el Enterprise Continuum al desarrollar una Enterprise Architecture?","optionsEs":["Para coordinar con los demás marcos de gestión en uso","Para describir cómo una arquitectura aborda las preocupaciones de los stakeholders","Para identificar y entender los requerimientos del negocio","Para estructurar activos de arquitectura y solución reutilizables"],"explainEs":""},{"id":13,"q":"Consider the following ADM phases objectives: 1) Identify candidate Architecture Roadmap components based upon gaps between the Baseline and Target Technology Architectures. 2) Identify candidate Architecture Roadmap components based upon gaps between the Baseline and Target Information Systems (Data and Application) Architectures. 3) Identify candidate Architecture Roadmap components based upon gaps between the Baseline and Target Business Architectures. 4) Obtain approval for a Statement of Architecture Work that defines a program of works to develop and deploy the architecture outlined in the Architecture Vision. Which phase does each objective match?","options":["1-A, 2-B, 3-C, 4-D","1-B, 2-D, 3-A, 4-C","1-C, 2-D, 3-B, 4-A","1-D, 2-C, 3-B, 4-A"],"correct":3,"explain":"","qEs":"Considere los siguientes objetivos de fases del ADM: 1) Identificar componentes candidatos del Architecture Roadmap con base en las brechas entre la Arquitectura Tecnológica Baseline y Target. 2) Identificar componentes candidatos del Architecture Roadmap con base en las brechas entre las Arquitecturas de Sistemas de Información (Datos y Aplicación) Baseline y Target. 3) Identificar componentes candidatos del Architecture Roadmap con base en las brechas entre la Arquitectura de Negocio Baseline y Target. 4) Obtener aprobación de un Statement of Architecture Work que defina un programa de trabajos para desarrollar y desplegar la arquitectura descrita en la Architecture Vision. ¿Con qué fase corresponde cada objetivo?","optionsEs":["1-A, 2-B, 3-C, 4-D","1-B, 2-D, 3-A, 4-C","1-C, 2-D, 3-B, 4-A","1-D, 2-C, 3-B, 4-A"],"explainEs":""},{"id":14,"q":"According to the TOGAF Standard, which of the following best describes the purpose of an Architecture Definition Document?","options":["To act as a deliverable container for artifacts created during a project","To ensure that architecture information is communicated to the right stakeholders at the right time","To provide a high-level view of the end architecture product","To show progression of change from the Baseline Architecture to the Target Architecture"],"correct":0,"explain":"","qEs":"Según el Estándar TOGAF, ¿cuál de las siguientes describe mejor el propósito de un Architecture Definition Document?","optionsEs":["Actuar como contenedor de entregables para los artefactos creados durante un proyecto","Asegurar que la información de arquitectura se comunique a los stakeholders correctos en el momento correcto","Ofrecer una visión de alto nivel del producto de arquitectura final","Mostrar la progresión del cambio desde la Arquitectura Baseline hasta la Arquitectura Objetivo"],"explainEs":""},{"id":15,"q":"Complete the sentence by selecting the applicable pair of words: A/an … is used in the Business Architecture phase to help identify and understand business … that the architecture has to address.","options":["activity model, perspective","business scenario, requirements","use-case, interconnections","business transformation readiness assessment, constraints"],"correct":1,"explain":"A business scenario is used in the Business Architecture phase to help identify and understand business requirements that the architecture has to address.","qEs":"Complete la oración eligiendo el par de palabras aplicable: Un/una … se usa en la fase de Business Architecture para ayudar a identificar y entender los … del negocio que la arquitectura debe abordar.","optionsEs":["modelo de actividad, perspectiva","business scenario, requerimientos","caso de uso, interconexiones","evaluación de preparación para la transformación del negocio, restricciones"],"explainEs":"Un business scenario se usa en la fase de Business Architecture para ayudar a identificar y entender los requerimientos del negocio que la arquitectura debe abordar."},{"id":16,"q":"Which statement about architecture partitioning is correct?","options":["A partitioning model is a necessity for Agile enterprises.","An enterprise should develop a partitioning model that reflects its organization structure.","Each enterprise needs to adopt a partitioning model that reflects its operating model.","The TOGAF Standard mandates the use of its partitioning model."],"correct":2,"explain":"","qEs":"¿Cuál afirmación sobre el particionamiento de arquitectura (architecture partitioning) es correcta?","optionsEs":["Un modelo de particionamiento es una necesidad para las empresas Agile.","Una empresa debe desarrollar un modelo de particionamiento que refleje su estructura organizacional.","Cada empresa necesita adoptar un modelo de particionamiento que refleje su modelo operativo.","El Estándar TOGAF exige el uso de su propio modelo de particionamiento."],"explainEs":""},{"id":17,"q":"Which of the following best describes the ADM diagram (the circular diagram with Preliminary and Phases A–H around a central Requirements Management)?","options":["A linear waterfall process model","A sequenced approach to develop an Enterprise Architecture","A stylized representation showing essential information flows","An iteration cycle"],"correct":2,"explain":"","qEs":"¿Cuál de las siguientes describe mejor el diagrama del ADM (el diagrama circular con la Fase Preliminar y las Fases A–H alrededor de una Requirements Management central)?","optionsEs":["Un modelo de proceso en cascada (waterfall) lineal","Un enfoque secuencial para desarrollar una Enterprise Architecture","Una representación estilizada que muestra flujos de información esenciales","Un ciclo de iteración"],"explainEs":""},{"id":18,"q":"According to the TOGAF Standard, which of the following best describes the purpose of an Architecture Roadmap?","options":["To ensure that architecture information is communicated to the right stakeholders at the right time","To govern the architecture throughout its implementation process","To provide a high-level view of the end architecture product","To show progression of change from the Baseline Architecture to the Target Architecture"],"correct":3,"explain":"The Architecture Roadmap lists individual work packages that will realize the Target Architecture and lays them out on a timeline to show progression from the Baseline Architecture to the Target Architecture.","qEs":"Según el Estándar TOGAF, ¿cuál de las siguientes describe mejor el propósito de un Architecture Roadmap?","optionsEs":["Asegurar que la información de arquitectura se comunique a los stakeholders correctos en el momento correcto","Gobernar la arquitectura durante todo su proceso de implementación","Ofrecer una visión de alto nivel del producto de arquitectura final","Mostrar la progresión del cambio desde la Arquitectura Baseline hasta la Arquitectura Objetivo"],"explainEs":"El Architecture Roadmap lista los paquetes de trabajo individuales que materializarán la Arquitectura Objetivo y los organiza en una línea de tiempo para mostrar la progresión desde la Arquitectura Baseline hasta la Arquitectura Objetivo."},{"id":19,"q":"Consider the TOGAF Content Framework image, structured in line with Architecture Principles/Vision/Requirements, Architecture Definition (Business, Information Systems, Technology), and Architecture Realization (Opportunities/Solutions/Migration Planning, Implementation Governance). What does this show?","options":["A Content Framework","A Digital Business","An Architecture Repository","An Enterprise Repository"],"correct":0,"explain":"This is the TOGAF Content Framework, which is structured in line with the phases of the ADM.","qEs":"Considere la imagen del TOGAF Content Framework, estructurada en línea con Architecture Principles/Vision/Requirements, Architecture Definition (Business, Information Systems, Technology) y Architecture Realization (Opportunities/Solutions/Migration Planning, Implementation Governance). ¿Qué muestra esto?","optionsEs":["Un Content Framework","Un Digital Business","Un Architecture Repository","Un Enterprise Repository"],"explainEs":"Este es el TOGAF Content Framework, estructurado en línea con las fases del ADM."},{"id":20,"q":"In which phase of the ADM does the TOGAF Standard align with Agile development?","options":["Phase B","Phase E","Phase F","Phase G"],"correct":3,"explain":"","qEs":"¿En qué fase del ADM se alinea el Estándar TOGAF con el desarrollo Agile?","optionsEs":["Fase B","Fase E","Fase F","Fase G"],"explainEs":""},{"id":21,"q":"Consider the following ADM phases objectives: 1) Determine whether an incremental approach is required, and if so identify Transition Architectures that will deliver continuous business value. 2) Ensure that the Implementation and Migration Plan is coordinated with the enterprise's approach to managing and implementing change in the enterprise's overall change portfolio. 3) Define the overall Solution Building Blocks (SBBs) to finalize the Target Architecture based on the Architecture Building Blocks (ABBs). 4) Ensure that the business value and cost of work packages and Transition Architectures is understood by key stakeholders. Which phase does each objective match?","options":["1-E, 2-F, 3-E, 4-F","1-E, 2-F, 3-F, 4-G","1-F, 2-G, 3-F, 4-F","1-G, 2-G, 3-E, 4-F"],"correct":0,"explain":"","qEs":"Considere los siguientes objetivos de fases del ADM: 1) Determinar si se requiere un enfoque incremental y, de ser así, identificar Transition Architectures que entreguen valor de negocio continuo. 2) Asegurar que el Implementation and Migration Plan esté coordinado con el enfoque de la empresa para gestionar e implementar el cambio dentro de su portafolio de cambio general. 3) Definir los Solution Building Blocks (SBBs) generales para finalizar la Arquitectura Objetivo con base en los Architecture Building Blocks (ABBs). 4) Asegurar que el valor de negocio y el costo de los paquetes de trabajo y las Transition Architectures sea comprendido por los stakeholders clave. ¿Con qué fase corresponde cada objetivo?","optionsEs":["1-E, 2-F, 3-E, 4-F","1-E, 2-F, 3-F, 4-G","1-F, 2-G, 3-F, 4-F","1-G, 2-G, 3-E, 4-F"],"explainEs":""},{"id":22,"q":"Which of the following best describes the purpose of the Business Transformation Readiness Assessment technique?","options":["To determine if the organization is ready to undergo change","To determine if the stakeholders support the implementation plan","To ensure that there are adequate trained engineers to develop the solution","To plan the migration steps needed to achieve the transformation"],"correct":0,"explain":"The Business Transformation Readiness Assessment technique is used for evaluating and quantifying an organization's readiness to undergo change.","qEs":"¿Cuál de las siguientes describe mejor el propósito de la técnica Business Transformation Readiness Assessment?","optionsEs":["Determinar si la organización está lista para emprender el cambio","Determinar si los stakeholders apoyan el plan de implementación","Asegurar que existan suficientes ingenieros capacitados para desarrollar la solución","Planificar los pasos de migración necesarios para lograr la transformación"],"explainEs":"La técnica Business Transformation Readiness Assessment se usa para evaluar y cuantificar la preparación de una organización para emprender el cambio."},{"id":23,"q":"Consider the following statement: In the ADM, documents which have been reviewed and approved are designated \"approved\" in accordance with the organization's governance practices. Which statement about approved documents is also true?","options":["Approved documents are finalized after a phase.","Approved documents are marked as draft until they are finalized.","Approved documents are not always finalized.","Approved documents may not be changed in subsequent phases."],"correct":2,"explain":"","qEs":"Considere la siguiente afirmación: En el ADM, los documentos que han sido revisados y aprobados se designan como \"approved\" de acuerdo con las prácticas de gobernanza de la organización. ¿Cuál afirmación sobre los documentos approved también es verdadera?","optionsEs":["Los documentos approved quedan finalizados después de una fase.","Los documentos approved se marcan como draft hasta que se finalizan.","Los documentos approved no siempre están finalizados.","Los documentos approved no pueden cambiarse en fases posteriores."],"explainEs":""},{"id":24,"q":"Which one of the following best describes the purpose of a Change Request?","options":["To ensure that information is communicated to the right stakeholders at the right time","To ensure that the results of a Compliance Assessment are distributed to the Architecture Board","To request a dispensation or to kick-start a further cycle of architecture work","To review project progress and ensure the implementation is in line with the objectives"],"correct":2,"explain":"","qEs":"¿Cuál de las siguientes describe mejor el propósito de un Change Request?","optionsEs":["Asegurar que la información se comunique a los stakeholders correctos en el momento correcto","Asegurar que los resultados de un Compliance Assessment se distribuyan al Architecture Board","Solicitar una dispensa o iniciar un nuevo ciclo de trabajo de arquitectura","Revisar el avance del proyecto y asegurar que la implementación esté alineada con los objetivos"],"explainEs":""},{"id":25,"q":"Why is it important to use iteration when applying the TOGAF ADM?","options":["It enables the capture of stakeholder requirements through the ADM cycle.","It helps identify business scenarios to choose from.","It supports returning to previous phases to update work products with new information.","It supports the selection of alternative Target Architectures."],"correct":2,"explain":"Iteration within an ADM cycle allows projects to operate multiple ADM phases concurrently, cycle between phases in planned cycles covering multiple phases, and return to previous phases to update work products with new information.","qEs":"¿Por qué es importante usar la iteración al aplicar el ADM de TOGAF?","optionsEs":["Permite capturar los requerimientos de los stakeholders a lo largo del ciclo del ADM.","Ayuda a identificar business scenarios entre los cuales elegir.","Permite regresar a fases anteriores para actualizar los productos de trabajo con nueva información.","Permite seleccionar Target Architectures alternativas."],"explainEs":"La iteración dentro de un ciclo del ADM permite que los proyectos operen en varias fases del ADM al mismo tiempo, ciclen entre fases en ciclos planificados que cubren varias fases, y regresen a fases anteriores para actualizar los productos de trabajo con nueva información."},{"id":26,"q":"What level of risk is the risk categorization prior to determining and implementing mitigating actions?","options":["Initial","Low","Marginal","Residual"],"correct":0,"explain":"","qEs":"¿Qué nivel de riesgo corresponde a la categorización del riesgo antes de determinar e implementar las acciones de mitigación?","optionsEs":["Initial (inicial)","Low (bajo)","Marginal","Residual"],"explainEs":""},{"id":27,"q":"Consider an image showing 'Business Capability for Architecture (Operating at a level of maturity)' with Governance Bodies, Skilled Resource Pool, Roles and Responsibilities, Project/Portfolio Governance, and the Enterprise Continuum used to classify inputs/outputs of the Architecture Repository. Which of the following does it illustrate?","options":["An Enterprise Architecture Capability","An Enterprise Architecture","An Enterprise Architecture framework","An Enterprise Architecture metamodel"],"correct":0,"explain":"","qEs":"Considere una imagen que muestra 'Business Capability for Architecture (operando en un nivel de madurez)' con Governance Bodies, Skilled Resource Pool, Roles and Responsibilities, Project/Portfolio Governance, y el Enterprise Continuum usado para clasificar entradas/salidas del Architecture Repository. ¿Cuál de las siguientes ilustra?","optionsEs":["Una Enterprise Architecture Capability","Una Enterprise Architecture","Un Enterprise Architecture framework","Un Enterprise Architecture metamodel"],"explainEs":""},{"id":28,"q":"Which of the following statements related to governance in Enterprise Architecture is the most correct?","options":["The architecture practitioner and implementer are directed and both are controlled by the stakeholder.","The architecture practitioner governs the architecture development and controls the implementer.","The CEO governs the architecture and directs the architecture practitioner and implementer.","The stakeholder directs the architecture development and controls the architecture changes."],"correct":0,"explain":"","qEs":"¿Cuál de las siguientes afirmaciones relacionadas con la gobernanza en Enterprise Architecture es la más correcta?","optionsEs":["El practicante de arquitectura y el implementador son dirigidos, y ambos son controlados, por el stakeholder.","El practicante de arquitectura gobierna el desarrollo de la arquitectura y controla al implementador.","El CEO gobierna la arquitectura y dirige al practicante de arquitectura y al implementador.","El stakeholder dirige el desarrollo de la arquitectura y controla los cambios de arquitectura."],"explainEs":""},{"id":29,"q":"Refer to the following table: Output & Outcome: Direction to proceed and start developing a Target Architecture that addresses perceived, real, or anticipated shortfalls in the enterprise relative to stakeholder preferences. Essential Knowledge: Gaps between approved target, or preference, and realization from prior work (Value Realization); changes in preference or priority (Stakeholder Requirements). Which ADM phase does this describe?","options":["Phase B","Phase E","Phase G","Phase H"],"correct":3,"explain":"The Output & Outcome and Essential Knowledge describe Phase H.","qEs":"Consulte la siguiente tabla: Output & Outcome: Dirección para proceder y comenzar a desarrollar una Arquitectura Objetivo que aborde deficiencias percibidas, reales o anticipadas en la empresa en relación con las preferencias de los stakeholders. Essential Knowledge: Brechas entre el objetivo aprobado, o preferencia, y la realización de trabajo previo (Value Realization); cambios en preferencia o prioridad (Stakeholder Requirements). ¿Qué fase del ADM describe esto?","optionsEs":["Fase B","Fase E","Fase G","Fase H"],"explainEs":"El Output & Outcome y el Essential Knowledge describen la Fase H."},{"id":30,"q":"What should be put in place to make sure that architectural artifacts are developed and used with accountability and responsibility?","options":["Governance of the Architecture Definition Document","Governance of the Architecture Vision","Governance of the management of Architecture Contracts","Governance of the Statement of Architecture Work"],"correct":2,"explain":"","qEs":"¿Qué debería establecerse para asegurar que los artefactos arquitectónicos se desarrollen y usen con accountability y responsabilidad?","optionsEs":["Gobernanza del Architecture Definition Document","Gobernanza de la Architecture Vision","Gobernanza de la gestión de los Architecture Contracts","Gobernanza del Statement of Architecture Work"],"explainEs":""},{"id":31,"q":"Consider the following ADM phases objectives: 1) Ensure that the Enterprise Architecture Capability meets current requirements. 2) Ensure conformance with the Target Architecture by implementation projects. 3) Finalize the Architecture Roadmap and the supporting Implementation and Migration Plan. 4) Perform appropriate Architecture Governance functions for the solution and any implementation-driven architecture Change Requests. Which phase does each objective match?","options":["1-E, 2-F, 3-F, 4-H","1-F, 2-G, 3-G, 4-F","1-F, 2-H, 3-H, 4-G","1-H, 2-G, 3-F, 4-G"],"correct":3,"explain":"","qEs":"Considere los siguientes objetivos de fases del ADM: 1) Asegurar que la Enterprise Architecture Capability cumpla con los requerimientos actuales. 2) Asegurar la conformidad con la Arquitectura Objetivo por parte de los proyectos de implementación. 3) Finalizar el Architecture Roadmap y el Implementation and Migration Plan que lo respalda. 4) Realizar las funciones apropiadas de Architecture Governance para la solución y cualquier Change Request de arquitectura derivado de la implementación. ¿Con qué fase corresponde cada objetivo?","optionsEs":["1-E, 2-F, 3-F, 4-H","1-F, 2-G, 3-G, 4-F","1-F, 2-H, 3-H, 4-G","1-H, 2-G, 3-F, 4-G"],"explainEs":""},{"id":32,"q":"Consider the following description: The first part uses the vision, principles, requirements, and other information to select sets of criteria fitting for different alternatives. The second part defines alternatives based on the criteria and builds an understanding of each. The third part will either select one of the alternatives, or else combine features from more than one, to create the proposed alternative. What does this describe?","options":["Architecture Partitioning","Iteration","The Architecture Trade-Off method","The Business Scenario method"],"correct":2,"explain":"","qEs":"Considere la siguiente descripción: La primera parte usa la visión, los principios, los requerimientos y otra información para seleccionar conjuntos de criterios apropiados para distintas alternativas. La segunda parte define alternativas con base en los criterios y construye un entendimiento de cada una. La tercera parte seleccionará una de las alternativas, o combinará características de más de una, para crear la alternativa propuesta. ¿Qué describe esto?","optionsEs":["Architecture Partitioning","Iteración","El método Architecture Trade-Off","El método Business Scenario"],"explainEs":""},{"id":33,"q":"When considering the scope of an architecture, what dimension considers the appropriate level of detail to be captured based on intended use of the Enterprise Architecture?","options":["Breadth","Depth","Project","Segment"],"correct":1,"explain":"","qEs":"Al considerar el alcance de una arquitectura, ¿qué dimensión considera el nivel de detalle apropiado a capturar según el uso previsto de la Enterprise Architecture?","optionsEs":["Breadth (amplitud)","Depth (profundidad)","Project (proyecto)","Segment (segmento)"],"explainEs":""},{"id":34,"q":"Consider an illustration of an architecture development cycle with Preliminary at the top center, and Phases A through H arranged around a central hub. Select the correct phase names corresponding to the Labels 1, 2, and 3 (1=B position, 2=D position, 3=F position).","options":["1-Architecture Vision, 2-Technology Architecture, 3-Migration Planning","1-Business Architecture, 2-Data Architecture, 3-Opportunities and Solutions","1-Business Architecture, 2-Technology Architecture, 3-Migration Planning","1-Information Systems Architectures, 2-Opportunities and Solutions, 3- Architecture Governance"],"correct":2,"explain":"","qEs":"Considere una ilustración de un ciclo de desarrollo de arquitectura con la Fase Preliminar en la parte superior central, y las Fases A a H dispuestas alrededor de un núcleo central. Seleccione los nombres de fase correctos correspondientes a las Etiquetas 1, 2 y 3 (1=posición B, 2=posición D, 3=posición F).","optionsEs":["1-Architecture Vision, 2-Technology Architecture, 3-Migration Planning","1-Business Architecture, 2-Data Architecture, 3-Opportunities and Solutions","1-Business Architecture, 2-Technology Architecture, 3-Migration Planning","1-Information Systems Architectures, 2-Opportunities and Solutions, 3-Architecture Governance"],"explainEs":""},{"id":35,"q":"Which of the following best describes a purpose of the Gap Analysis technique?","options":["To catch errors in a project architecture early","To guide decision-making throughout the enterprise","To help identify and understand business requirements","To highlight shortfalls between the Baseline and Target Architectures."],"correct":3,"explain":"","qEs":"¿Cuál de las siguientes describe mejor un propósito de la técnica Gap Analysis?","optionsEs":["Detectar errores en la arquitectura de un proyecto de forma temprana","Guiar la toma de decisiones en toda la empresa","Ayudar a identificar y entender los requerimientos del negocio","Resaltar deficiencias entre la Arquitectura Baseline y la Arquitectura Objetivo"],"explainEs":""},{"id":36,"q":"Which section of the TOGAF template for Architecture Principles highlights the requirements for the Business and IT, for carrying out the principle?","options":["Implications","Name","Rationale","Statement"],"correct":0,"explain":"","qEs":"¿Qué sección de la plantilla de TOGAF para Architecture Principles resalta los requerimientos del negocio y de TI para llevar a cabo el principio?","optionsEs":["Implications","Name","Rationale","Statement"],"explainEs":""},{"id":37,"q":"The strategy for a hardware store chain includes expanding its sales from physical stores to include online sales and services. You have been asked if they should use an Enterprise Architecture to support this
