e Governance is a topic in the TOGAF Enterprise Architecture Foundation syllabus.","qEs":"¿Cuál de los siguientes es un tema de unidad incluido en el temario de TOGAF Enterprise Architecture Foundation?","optionsEs":["Architecture Governance","Digital Infrastructure","Interoperability Requirements","Value Streams"],"explainEs":"Architecture Governance es un tema del temario de TOGAF Enterprise Architecture Foundation."},{"unit":0,"unitName":"Unit 0 — Certification","q":"Which of the following describes the retake policy for the TOGAF Enterprise Architecture Part 1 examination?","options":["You must wait seven (7) days before a retake.","You can retake the exam immediately.","You must wait one (1) month before a retake.","You must wait three (3) weeks before a retake."],"correct":2,"explain":"The Open Group certification policy requires that candidates wait one month before a retake.","qEs":"¿Cuál de las siguientes describe la política de repetición (retake) del examen TOGAF Enterprise Architecture Part 1?","optionsEs":["Debe esperar siete (7) días antes de repetirlo.","Puede repetir el examen de inmediato.","Debe esperar un (1) mes antes de repetirlo.","Debe esperar tres (3) semanas antes de repetirlo."],"explainEs":"La política de certificación de The Open Group exige que los candidatos esperen un mes antes de repetir el examen."},{"unit":1,"unitName":"Unit 1 — Concepts","q":"Which of the following best describes why the TOGAF Standard is suitable as a framework for Enterprise Architecture?","options":["It de-risks a technically complex process.","It contains an extensive body of knowledge called the TOGAF Library.","The TOGAF documentation includes the universal concepts of Enterprise Architecture.","It enables more effective decision-making by business leaders."],"correct":0,"explain":"Developing and sustaining an Enterprise Architecture is a technically complex process which involves many stakeholders and decision processes in the organization. Adopting the TOGAF Standard as a framework provides a standardized approach and de-risks the activity.","qEs":"¿Cuál de las siguientes describe mejor por qué el Estándar TOGAF es adecuado como marco para la Enterprise Architecture?","optionsEs":["Reduce el riesgo de un proceso técnicamente complejo.","Contiene un extenso cuerpo de conocimiento llamado la TOGAF Library.","La documentación de TOGAF incluye los conceptos universales de Enterprise Architecture.","Permite una toma de decisiones más efectiva por parte de los líderes de negocio."],"explainEs":"Desarrollar y sostener una Enterprise Architecture es un proceso técnicamente complejo que involucra a muchos stakeholders y procesos de decisión en la organización. Adoptar el Estándar TOGAF como marco ofrece un enfoque estandarizado y reduce el riesgo de la actividad."},{"unit":1,"unitName":"Unit 1 — Concepts","q":"Complete the sentence: Three of the four architecture domains that are commonly accepted as subsets of an overall Enterprise Architecture are …","options":["Baseline, Transition, Target.","Data, Application, Technology.","Capability, Segment, Strategic.","Abstract, Logical, Physical."],"correct":1,"explain":"Data, Application, and Technology are three of the four architecture domains that are commonly accepted as subsets of an overall Enterprise Architecture. The other is Business.","qEs":"Complete la oración: Tres de los cuatro dominios de arquitectura comúnmente aceptados como subconjuntos de una Enterprise Architecture general son …","optionsEs":["Baseline, Transition, Target.","Data, Application, Technology.","Capability, Segment, Strategic.","Abstract, Logical, Physical."],"explainEs":"Data, Application y Technology son tres de los cuatro dominios de arquitectura comúnmente aceptados como subconjuntos de una Enterprise Architecture general. El otro es Business."},{"unit":1,"unitName":"Unit 1 — Concepts","q":"Which architecture abstraction level answers why an enterprise undertakes architecture work, and what is the scope of work?","options":["Conceptual","Contextual","Logical","Physical"],"correct":1,"explain":"Contextual includes understanding the environment in which an enterprise operates and the context in which architecture work is planned and executed. It answers why an enterprise undertakes architecture work, what is the scope of work, and the motivation in terms of goals, drivers, and objectives.","qEs":"¿Qué nivel de abstracción de arquitectura responde por qué una empresa emprende el trabajo de arquitectura, y cuál es el alcance del trabajo?","optionsEs":["Conceptual","Contextual","Logical","Physical"],"explainEs":"Contextual incluye entender el entorno en el que opera una empresa y el contexto en el que se planifica y ejecuta el trabajo de arquitectura. Responde por qué una empresa emprende el trabajo de arquitectura, cuál es el alcance del trabajo, y la motivación en términos de metas, impulsores y objetivos."},{"unit":1,"unitName":"Unit 1 — Concepts","q":"Which of the following is a structural framework that allows an enterprise to distinguish between different types of architectural assets?","options":["Architecture Framework","Architecture Repository","Governance Repository","Strategic Architecture"],"correct":1,"explain":"The TOGAF Standard provides a structural framework for an Architecture Repository that allows an enterprise to distinguish between different types of architectural assets that exist at different levels of abstraction in the organization.","qEs":"¿Cuál de las siguientes es un marco estructural que permite a una empresa distinguir entre diferentes tipos de activos arquitectónicos?","optionsEs":["Architecture Framework","Architecture Repository","Governance Repository","Strategic Architecture"],"explainEs":"El Estándar TOGAF ofrece un marco estructural para un Architecture Repository que permite a una empresa distinguir entre diferentes tipos de activos arquitectónicos que existen en distintos niveles de abstracción en la organización."},{"unit":1,"unitName":"Unit 1 — Concepts","q":"Which of the following is a purpose of gap analysis?","options":["Assessing readiness for change within an Enterprise Architecture team","Documenting a categorization framework to structure architecture views","Identifying shortfalls between Baseline and Target Architectures","Finding a balance between positive and negative outcomes"],"correct":2,"explain":"Gap analysis is a technique used in the ADM to validate an architecture that is being developed. It is usually the final step within a phase. The basic premise is to highlight a shortfall between the Baseline Architecture and the Target Architecture; that is, items that have been deliberately omitted, accidentally left out, or not yet defined.","qEs":"¿Cuál de las siguientes es un propósito del gap analysis?","optionsEs":["Evaluar la preparación para el cambio dentro de un equipo de Enterprise Architecture","Documentar un marco de categorización para estructurar vistas de arquitectura","Identificar deficiencias entre la Arquitectura Baseline y la Objetivo","Encontrar un equilibrio entre resultados positivos y negativos"],"explainEs":"El gap analysis es una técnica usada en el ADM para validar una arquitectura en desarrollo. Suele ser el último paso dentro de una fase. La premisa básica es resaltar una deficiencia entre la Arquitectura Baseline y la Arquitectura Objetivo: elementos omitidos deliberadamente, dejados fuera por accidente, o aún no definidos."},{"unit":1,"unitName":"Unit 1 — Concepts","q":"Complete the sentence: The Enterprise Continuum provides a classification for …","options":["architecture and solution artifacts.","architecture views and viewpoints.","risk categorizations.","services and information systems."],"correct":0,"explain":"The Enterprise Continuum provides a classification for architecture and solution artifacts, both internal and external to the Architecture Repository, as they evolve from generic Foundation Architectures to Organization-Specific Architectures.","qEs":"Complete la oración: El Enterprise Continuum ofrece una clasificación para …","optionsEs":["los artefactos de arquitectura y de solución.","las vistas y los viewpoints de arquitectura.","las categorizaciones de riesgo.","los servicios y sistemas de información."],"explainEs":"El Enterprise Continuum ofrece una clasificación para los artefactos de arquitectura y de solución, tanto internos como externos al Architecture Repository, a medida que evolucionan desde Foundation Architectures genéricas hasta Organization-Specific Architectures."},{"unit":1,"unitName":"Unit 1 — Concepts","q":"Which does the TOGAF Standard define as a collection of organizations that have common goals?","options":["An architecture","An enterprise","A federation","A system"],"correct":1,"explain":"The TOGAF Standard considers an \"enterprise\" to be any collection of organizations that have common goals.","qEs":"¿Qué define el Estándar TOGAF como un conjunto de organizaciones que tienen objetivos comunes?","optionsEs":["Una arquitectura","Una enterprise","Una federación","Un sistema"],"explainEs":"El Estándar TOGAF considera que una \"enterprise\" es cualquier conjunto de organizaciones que tienen objetivos comunes."},{"unit":1,"unitName":"Unit 1 — Concepts","q":"Complete the sentence: The Enterprise Metamodel defines …","options":["a categorization model used to structure the Architecture Description.","a structural model for an Architecture Repository.","the assets in use by the enterprise as a structural model.","the types of entities used in models describing the enterprise."],"correct":3,"explain":"The Enterprise Metamodel defines the types of entities to appear in the models that describe the enterprise, together with the relationships between these entities.","qEs":"Complete la oración: El Enterprise Metamodel define …","optionsEs":["un modelo de categorización usado para estructurar la Architecture Description.","un modelo estructural para un Architecture Repository.","los activos en uso por la empresa como modelo estructural.","los tipos de entidades usados en los modelos que describen la empresa."],"explainEs":"El Enterprise Metamodel define los tipos de entidades que aparecen en los modelos que describen la empresa, junto con las relaciones entre esas entidades."},{"unit":1,"unitName":"Unit 1 — Concepts","q":"Complete the sentence: Risk management is …","options":["a categorization model used prior to determining mitigating actions.","about predicting future shortfalls in a Target Architecture.","striking a balance between positive and negative outcomes.","the effect of uncertainty on objectives."],"correct":2,"explain":"Risk management is about striking a balance between positive and negative outcomes resulting from the realization of either opportunities or threats.","qEs":"Complete la oración: La gestión de riesgos (risk management) es …","optionsEs":["un modelo de categorización usado antes de determinar las acciones de mitigación.","predecir deficiencias futuras en una Arquitectura Objetivo.","encontrar un equilibrio entre resultados positivos y negativos.","el efecto de la incertidumbre sobre los objetivos."],"explainEs":"La gestión de riesgos consiste en encontrar un equilibrio entre los resultados positivos y negativos que resultan de la materialización de oportunidades o amenazas."},{"unit":2,"unitName":"Unit 2 — Definitions","q":"Which of the following is defined as the highest level (typically) of description of an organization and typically covers all missions and functions?","options":["Business Architecture","Digital Architecture","Enterprise","Target Architecture"],"correct":2,"explain":"Enterprise is defined as the highest level (typically) of description of an organization and typically covers all missions and functions. An enterprise will often span multiple organizations.","qEs":"¿Cuál de las siguientes se define como el nivel más alto (típicamente) de descripción de una organización, y típicamente cubre todas sus misiones y funciones?","optionsEs":["Business Architecture","Digital Architecture","Enterprise","Target Architecture"],"explainEs":"Enterprise se define como el nivel más alto (típicamente) de descripción de una organización, y típicamente cubre todas sus misiones y funciones. Una enterprise suele abarcar varias organizaciones."},{"unit":2,"unitName":"Unit 2 — Definitions","q":"Which of the following is defined as a specification that has been formally reviewed and agreed upon, that thereafter serves as the basis for further development?","options":["Baseline","Deliverable","Requirement","Work package"],"correct":0,"explain":"Baseline is defined as a specification that has been formally reviewed and agreed upon, that thereafter serves as the basis for further development or change and that can be changed only through formal change control procedures or a type of procedure such as configuration management.","qEs":"¿Cuál de las siguientes se define como una especificación que ha sido formalmente revisada y acordada, y que a partir de entonces sirve de base para el desarrollo posterior?","optionsEs":["Baseline","Deliverable","Requirement","Work package"],"explainEs":"Baseline se define como una especificación que ha sido formalmente revisada y acordada, que a partir de entonces sirve de base para el desarrollo o cambio posterior, y que solo puede modificarse mediante procedimientos formales de control de cambios."},{"unit":2,"unitName":"Unit 2 — Definitions","q":"Which of the following is defined as the fundamental concepts or properties of a system in its environment embodied in its elements, relationships, and in the principles of its design and evolution?","options":["Architecture","Architecture domain","Architecture Framework","Architecture model"],"correct":0,"explain":"Architecture is defined as the fundamental concepts or properties of a system in its environment embodied in its elements, relationships, and in the principles of its design and evolution.","qEs":"¿Cuál de las siguientes se define como los conceptos o propiedades fundamentales de un sistema en su entorno, plasmados en sus elementos, relaciones, y en los principios de su diseño y evolución?","optionsEs":["Architecture","Architecture domain","Architecture Framework","Architecture model"],"explainEs":"Architecture se define como los conceptos o propiedades fundamentales de un sistema en su entorno, plasmados en sus elementos, relaciones, y en los principios de su diseño y evolución."},{"unit":2,"unitName":"Unit 2 — Definitions","q":"What is defined as the statement of difference between two states?","options":["Architecture","Gap","Requirement","Work package"],"correct":1,"explain":"Gap is defined as the statement of difference between two states. It is used in the context of gap analysis, where the difference between the Baseline and Target Architecture is identified.","qEs":"¿Qué se define como la declaración de la diferencia entre dos estados?","optionsEs":["Architecture","Gap","Requirement","Work package"],"explainEs":"Gap se define como la declaración de la diferencia entre dos estados. Se usa en el contexto del gap analysis, donde se identifica la diferencia entre la Arquitectura Baseline y la Objetivo."},{"unit":3,"unitName":"Unit 3 — Introduction to the ADM","q":"Which of the ADM phases finalizes a detailed plan for moving from the Baseline Architecture to the Target Architecture?","options":["Phase B: Business Architecture","Phase C: Information Systems Architectures","Phase E: Opportunities and Solutions","Phase F: Migration Planning"],"correct":3,"explain":"Phase F: Migration Planning provides guidance on how to move from the Baseline to the Target Architectures by finalizing a detailed Implementation and Migration Plan.","qEs":"¿Cuál de las fases del ADM finaliza un plan detallado para moverse de la Arquitectura Baseline a la Arquitectura Objetivo?","optionsEs":["Fase B: Business Architecture","Fase C: Information Systems Architectures","Fase E: Opportunities and Solutions","Fase F: Migration Planning"],"explainEs":"La Fase F: Migration Planning ofrece guía sobre cómo moverse de la Arquitectura Baseline a la Objetivo, finalizando un Implementation and Migration Plan detallado."},{"unit":3,"unitName":"Unit 3 — Introduction to the ADM","q":"Which of the ADM phases includes customization of the TOGAF framework and definition of Architecture Principles?","options":["Phase A: Architecture Vision","Phase C: Information Systems Architectures","Phase F: Migration Planning","Preliminary Phase"],"correct":3,"explain":"The Preliminary Phase includes the preparation and initiation activities required to create an Architecture Capability, as well as customization of the TOGAF framework and definition of Architecture Principles.","qEs":"¿Cuál de las fases del ADM incluye la personalización del framework de TOGAF y la definición de los Architecture Principles?","optionsEs":["Fase A: Architecture Vision","Fase C: Information Systems Architectures","Fase F: Migration Planning","Preliminary Phase"],"explainEs":"La Preliminary Phase incluye las actividades de preparación e inicio necesarias para crear una Architecture Capability, así como la personalización del framework de TOGAF y la definición de Architecture Principles."},{"unit":3,"unitName":"Unit 3 — Introduction to the ADM","q":"Complete the sentence: A document that is under development that has not undergone any formal review is known as …","options":["a draft document.","an initial document.","a preliminary document.","an unapproved document."],"correct":0,"explain":"In the ADM, documents which are under development and have not undergone any formal review and approval process are designated \"draft\". Documents which have been reviewed and approved are designated \"approved\" in accordance with the organization's governance practices. Approved does not necessarily mean finalized.","qEs":"Complete la oración: Un documento que está en desarrollo y no ha pasado por ninguna revisión formal se conoce como …","optionsEs":["un documento draft (borrador).","un documento inicial.","un documento preliminar.","un documento no aprobado."],"explainEs":"En el ADM, los documentos que están en desarrollo y no han pasado por ningún proceso formal de revisión y aprobación se designan como \"draft\". Los documentos que han sido revisados y aprobados se designan como \"approved\" según las prácticas de gobernanza de la organización. Approved no significa necesariamente finalizado."},{"unit":3,"unitName":"Unit 3 — Introduction to the ADM","q":"Complete the sentence: The purpose of the Preliminary Phase is to …","options":["develop the Enterprise Architecture Capability.","identify key stakeholders.","obtain agreement on a summary of the target.","manage architecture requirements."],"correct":0,"explain":"The purpose of the Preliminary Phase is to develop the Enterprise Architecture Capability. It is designed as a customized journey of the TOGAF ADM.","qEs":"Complete la oración: El propósito de la Preliminary Phase es …","optionsEs":["desarrollar la Enterprise Architecture Capability.","identificar a los stakeholders clave.","obtener acuerdo sobre un resumen del objetivo.","gestionar los requerimientos de arquitectura."],"explainEs":"El propósito de la Preliminary Phase es desarrollar la Enterprise Architecture Capability. Está diseñada como un recorrido personalizado del ADM de TOGAF."},{"unit":3,"unitName":"Unit 3 — Introduction to the ADM","q":"Consider the TOGAF ADM graphic of the architecture development cycle (the circular diagram with Preliminary at the top and Phases A–H around a central hub). Select the correct phase names corresponding to Labels 1, 2, and 3 (1=H position, 2=Requirements Management/center, 3=E position).","options":["1-Architecture Vision, 2-Preliminary, 3-Business Architecture","1-Implementation Governance, 2-Requirements Management, 3-Opportunities and Solutions","1-Business Architecture, 2-Technology Architecture, 3-Migration Planning","1-Architecture Change Management, 2-Opportunities and Solutions, 3-Architecture Governance"],"correct":1,"explain":"","qEs":"Considere el gráfico del ADM de TOGAF del ciclo de desarrollo de arquitectura (el diagrama circular con Preliminary arriba y las Fases A–H alrededor de un núcleo central). Seleccione los nombres de fase correctos correspondientes a las Etiquetas 1, 2 y 3 (1=posición H, 2=Requirements Management/centro, 3=posición E).","optionsEs":["1-Architecture Vision, 2-Preliminary, 3-Business Architecture","1-Implementation Governance, 2-Requirements Management, 3-Opportunities and Solutions","1-Business Architecture, 2-Technology Architecture, 3-Migration Planning","1-Architecture Change Management, 2-Opportunities and Solutions, 3-Architecture Governance"],"explainEs":""},{"unit":3,"unitName":"Unit 3 — Introduction to the ADM","q":"When scoping an architecture, which aspect of the scope describes the level of detail the architecting effort should go to?","options":["Architecture domains","Breadth","Depth","Time period requirements."],"correct":2,"explain":"Depth describes to what level of detail the architecting effort should go.","qEs":"Al definir el alcance de una arquitectura, ¿qué aspecto del alcance describe el nivel de detalle al que debe llegar el esfuerzo de arquitectura?","optionsEs":["Architecture domains","Breadth","Depth","Time period requirements."],"explainEs":"Depth describe a qué nivel de detalle debe llegar el esfuerzo de arquitectura."},{"unit":3,"unitName":"Unit 3 — Introduction to the ADM","q":"Which of the following best describes the ADM graphic?","options":["An activity sequence for developing an Enterprise Architecture","A process model for developing mandatory inputs and outputs","A representation showing information flows","A set of practices for managing requirements"],"correct":2,"explain":"The TOGAF ADM should not be understood as a process model. The ADM graphic is a stylized representation showing essential information flows and is not a representation of activity sequence.","qEs":"¿Cuál de las siguientes describe mejor el gráfico del ADM?","optionsEs":["Una secuencia de actividades para desarrollar una Enterprise Architecture","Un modelo de proceso para desarrollar entradas y salidas obligatorias","Una representación que muestra flujos de información","Un conjunto de prácticas para gestionar requerimientos"],"explainEs":"El ADM de TOGAF no debe entenderse como un modelo de proceso. El gráfico del ADM es una representación estilizada que muestra flujos de información esenciales, y no representa una secuencia de actividades."},{"unit":3,"unitName":"Unit 3 — Introduction to the ADM","q":"Why are architecture alternatives and trade-offs needed?","options":["To present different possibilities with their trade-offs to stakeholders","To enable the architects to decide which alternative to select","To confirm that the baseline architecture is correct","To follow the set of practices for managing requirements"],"correct":0,"explain":"By identifying and considering alternative Target Architectures an understanding can be built of the different possibilities and trade-offs identified between the alternatives. Presenting different alternatives and trade-offs to stakeholders helps architects to extract hidden agendas, principles, and requirements that could impact the final Target Architecture.","qEs":"¿Por qué se necesitan las alternativas y los trade-offs de arquitectura?","optionsEs":["Para presentar diferentes posibilidades con sus trade-offs a los stakeholders","Para permitir que los arquitectos decidan qué alternativa seleccionar","Para confirmar que la arquitectura baseline es correcta","Para seguir el conjunto de prácticas de gestión de requerimientos"],"explainEs":"Al identificar y considerar Target Architectures alternativas se puede construir un entendimiento de las distintas posibilidades y trade-offs entre las alternativas. Presentar diferentes alternativas y trade-offs a los stakeholders ayuda a los arquitectos a extraer agendas ocultas, principios y requerimientos que podrían afectar la Arquitectura Objetivo final."},{"unit":3,"unitName":"Unit 3 — Introduction to the ADM","q":"Which concept does the TOGAF Standard provide to govern the Target Architecture?","options":["Architecture Continuum","Architecture Development Method (ADM)","Architecture Landscape","Architecture Project"],"correct":3,"explain":"The TOGAF Standard provides a key concept to govern the Target Architecture: the Architecture Project. It is used to direct and control the Enterprise Architecture team to address issues in the enterprise. An Architecture Project starts with a Request for Architecture Work, and the primary control is Architecture Project Management using the Statement of Architecture Work.","qEs":"¿Qué concepto ofrece el Estándar TOGAF para gobernar la Arquitectura Objetivo?","optionsEs":["Architecture Continuum","Architecture Development Method (ADM)","Architecture Landscape","Architecture Project"],"explainEs":"El Estándar TOGAF ofrece un concepto clave para gobernar la Arquitectura Objetivo: el Architecture Project. Se usa para dirigir y controlar al equipo de Enterprise Architecture al abordar problemas en la empresa. Un Architecture Project inicia con un Request for Architecture Work, y el control principal es el Architecture Project Management usando el Statement of Architecture Work."},{"unit":3,"unitName":"Unit 3 — Introduction to the ADM","q":"Which of the following is an objective of Phase A?","options":["To review the stakeholders, their requirements, and priorities","To develop a high-level vision of the business value to be delivered","To generate and gain consensus on an outline Implementation and Migration Strategy","To formulate recommendations for each implementation project"],"correct":1,"explain":"An objective of Phase A is to develop a high-level aspirational vision of the capabilities and business value to be delivered as a result of the proposed Enterprise Architecture.","qEs":"¿Cuál de las siguientes es un objetivo de la Fase A?","optionsEs":["Revisar a los stakeholders, sus requerimientos y prioridades","Desarrollar una visión de alto nivel del valor de negocio a entregar","Generar y lograr consenso sobre un esquema de Implementation and Migration Strategy","Formular recomendaciones para cada proyecto de implementación"],"explainEs":"Un objetivo de la Fase A es desarrollar una visión aspiracional de alto nivel de las capacidades y del valor de negocio que se entregarán como resultado de la Enterprise Architecture propuesta."},{"unit":3,"unitName":"Unit 3 — Introduction to the ADM","q":"Consider the following ADM phases objectives: 1) Ensure that the Architecture Governance framework is executed. 2) Perform appropriate Architecture Governance functions for the solution and any implementation-driven architecture Change Requests. 3) Ensure that the business value and cost of work packages and Transition Architectures is understood by key stakeholders. 4) Ensure that the architecture development cycle is maintained. Which phase does each objective match?","options":["1-E, 2-F, 3-F, 4-H","1-F, 2-G, 3-G, 4-F","1-F, 2-H, 3-H, 4-G","1-H, 2-G, 3-F, 4-H"],"correct":3,"explain":"","qEs":"Considere los siguientes objetivos de fases del ADM: 1) Asegurar que se ejecute el marco de Architecture Governance. 2) Realizar las funciones apropiadas de Architecture Governance para la solución y cualquier Change Request de arquitectura derivado de la implementación. 3) Asegurar que el valor de negocio y el costo de los work packages y las Transition Architectures sea comprendido por los stakeholders clave. 4) Asegurar que se mantenga el ciclo de desarrollo de arquitectura. ¿Con qué fase corresponde cada objetivo?","optionsEs":["1-E, 2-F, 3-F, 4-H","1-F, 2-G, 3-G, 4-F","1-F, 2-H, 3-H, 4-G","1-H, 2-G, 3-F, 4-H"],"explainEs":""},{"unit":3,"unitName":"Unit 3 — Introduction to the ADM","q":"Refer to the following table — Phase: ?, Output & Outcome: A set of domain architectures approved by the stakeholders for the problem being addressed, with a set of gaps, and work to close the gaps understood by the stakeholders. Which ADM phase(s) does this describe?","options":["Phase A","Phases B, C, and D","Phase E","Phase F"],"correct":1,"explain":"Phases B, C, and D.","qEs":"Consulte la siguiente tabla — Fase: ?, Output & Outcome: Un conjunto de arquitecturas de dominio aprobadas por los stakeholders para el problema abordado, con un conjunto de brechas, y trabajo para cerrar las brechas entendido por los stakeholders. ¿Qué fase(s) del ADM describe esto?","optionsEs":["Fase A","Fases B, C y D","Fase E","Fase F"],"explainEs":"Fases B, C y D."},{"unit":3,"unitName":"Unit 3 — Introduction to the ADM","q":"Consider the following statements about ADM phases: 1) Develop the Enterprise Architecture capability. 2) Develop a set of work packages that address the set of gaps, with an indication of value produced and effort required. 3) Complete the projects to implement the changes necessary to reach the adjusted target state. Which phase(s) does each statement match?","options":["1-Preliminary, 2-E, 3-G","1-A, 2F, 3-H","1-A, 2-E, 3-G","1-H, 2-A, 3-G"],"correct":0,"explain":"1-Preliminary, 2-E, 3-G.","qEs":"Considere las siguientes afirmaciones sobre las fases del ADM: 1) Desarrollar la capacidad de Enterprise Architecture. 2) Desarrollar un conjunto de work packages que aborden el conjunto de brechas, con una indicación del valor producido y el esfuerzo requerido. 3) Completar los proyectos para implementar los cambios necesarios y alcanzar el estado objetivo ajustado. ¿Con qué fase(s) corresponde cada afirmación?","optionsEs":["1-Preliminary, 2-E, 3-G","1-A, 2F, 3-H","1-A, 2-E, 3-G","1-H, 2-A, 3-G"],"explainEs":"1-Preliminary, 2-E, 3-G."},{"unit":3,"unitName":"Unit 3 — Introduction to the ADM","q":"Which ADM phase aligns with Agile Software Development?","options":["Preliminary","Phase A","Phase E","Phase G"],"correct":3,"explain":"The TOGAF Standard aligns with Agile development in Phase G, where a project is implemented.","qEs":"¿Qué fase del ADM se alinea con Agile Software Development?","optionsEs":["Preliminary","Fase A","Fase E","Fase G"],"explainEs":"El Estándar TOGAF se alinea con el desarrollo Agile en la Fase G, donde se implementa un proyecto."},{"unit":4,"unitName":"Unit 4 — ADM Techniques","q":"Which of the following is a purpose of Architecture Principles?","options":["Assessing readiness for change","Enabling decision-making","Identifying business requirements","Mitigating risk"],"correct":1,"explain":"Architecture Principles can be used for enabling decision-making — it is important to set precedence during trade-off discussions and authority of \"tie-breaking\" if it must occur.","qEs":"¿Cuál de las siguientes es un propósito de los Architecture Principles?","optionsEs":["Evaluar la preparación para el cambio","Habilitar la toma de decisiones","Identificar requerimientos de negocio","Mitigar el riesgo"],"explainEs":"Los Architecture Principles pueden usarse para habilitar la toma de decisiones — es importante que sienten precedente durante las discusiones de trade-off y tengan autoridad de \"desempate\" cuando sea necesario."},{"unit":4,"unitName":"Unit 4 — ADM Techniques","q":"Which part of the TOGAF template for defining Architecture Principles should highlight the business benefits of adhering to the principle?","options":["Implications","Name","Rationale","Statement"],"correct":2,"explain":"The rationale should highlight the business benefits of adhering to the principle.","qEs":"¿Qué parte de la plantilla de TOGAF para definir Architecture Principles debe resaltar los beneficios de negocio de cumplir con el principio?","optionsEs":["Implications","Name","Rationale","Statement"],"explainEs":"El Rationale debe resaltar los beneficios de negocio de cumplir con el principio."},{"unit":4,"unitName":"Unit 4 — ADM Techniques","q":"Where can the Business Scenario method be used to define requirements for establishing an Enterprise Architecture Capability?","options":["Preliminary Phase","Phase A: Architecture Vision","Phase F: Migration Planning","Phase H: Architecture Change Management"],"correct":0,"explain":"The Business Scenario method can be used in the Preliminary Phase to define requirements for establishing an Enterprise Architecture Capability.","qEs":"¿Dónde puede usarse el método Business Scenario para definir los requerimientos para establecer una Enterprise Architecture Capability?","optionsEs":["Preliminary Phase","Fase A: Architecture Vision","Fase F: Migration Planning","Fase H: Architecture Change Management"],"explainEs":"El método Business Scenario puede usarse en la Preliminary Phase para definir los requerimientos para establecer una Enterprise Architecture Capability."},{"unit":4,"unitName":"Unit 4 — ADM Techniques","q":"Which of the following statements best describes the Business Transformation Readiness Assessment technique?","options":["A technique to define the degree to which information and services are to be shared.","A technique used to identify and understand the business requirements an architecture must address.","A technique used to develop general rules and guidelines for the architecture being developed.","A technique used to understand the readiness of an organization to accept change."],"correct":3,"explain":"The Business Transformation Readiness Assessment technique is a technique for determining the readiness of an organization to accept change.","qEs":"¿Cuál de las siguientes afirmaciones describe mejor la técnica Business Transformation Readiness Assessment?","optionsEs":["Una técnica para definir el grado en que la información y los servicios deben compartirse.","Una técnica usada para identificar y entender los requerimientos de negocio que una arquitectura debe abordar.","Una técnica usada para desarrollar reglas y guías generales para la arquitectura en desarrollo.","Una técnica usada para entender la preparación de una organización para aceptar el cambio."],"explainEs":"La técnica Business Transformation Readiness Assessment es una técnica para determinar la preparación de una organización para aceptar el cambio."},{"unit":4,"unitName":"Unit 4 — ADM Techniques","q":"Consider the TOGAF Standard structure: the Fundamental Content sits alongside a guidance component that explains how to use and adapt the standard for specific needs. What is that guidance component?","options":["ADM Techniques","TOGAF Standard","TOGAF Library","TOGAF Series Guides"],"correct":3,"explain":"The TOGAF Series Guides are the guidance part of the TOGAF Standard, providing material on how to use and adapt the TOGAF Standard for specific needs.","qEs":"Considere la estructura del Estándar TOGAF: el Fundamental Content está acompañado de un componente de guía que explica cómo usar y adaptar el estándar para necesidades específicas. ¿Cuál es ese componente de guía?","optionsEs":["ADM Techniques","TOGAF Standard","TOGAF Library","TOGAF Series Guides"],"explainEs":"Las TOGAF Series Guides son la parte de guía del Estándar TOGAF, y ofrecen material sobre cómo usar y adaptar el Estándar TOGAF para necesidades específicas."},{"unit":4,"unitName":"Unit 4 — ADM Techniques","q":"Where are risks identified as part of the initial Business Transformation Readiness Assessment?","options":["Preliminary","Phase A","Phase B","Phase E"],"correct":1,"explain":"Risks are identified in Phase A as part of the initial Business Transformation Readiness Assessment.","qEs":"¿Dónde se identifican los riesgos como parte del Business Transformation Readiness Assessment inicial?","optionsEs":["Preliminary","Fase A","Fase B","Fase E"],"explainEs":"Los riesgos se identifican en la Fase A como parte del Business Transformation Readiness Assessment inicial."},{"unit":5,"unitName":"Unit 5 — Applying the ADM","q":"Where in the TOGAF Standard is detailed guidance on applying the standard provided?","options":["TOGAF Fundamental Content","TOGAF Library","TOGAF Series Guides","TOGAF White Papers"],"correct":2,"explain":"Detailed guidance on how to apply the standard is provided within the TOGAF Series Guides, designed to support practitioners who need further explanation or more detail than that provided in the TOGAF Fundamental Content.","qEs":"¿Dónde, dentro del Estándar TOGAF, se ofrece una guía detallada sobre cómo aplicar el estándar?","optionsEs":["TOGAF Fundamental Content","TOGAF Library","TOGAF Series Guides","TOGAF White Papers"],"explainEs":"La guía detallada sobre cómo aplicar el estándar se ofrece dentro de las TOGAF Series Guides, diseñadas para apoyar a los practicantes que necesitan explicaciones adicionales o más detalle que el que ofrece el TOGAF Fundamental Content."},{"unit":5,"unitName":"Unit 5 — Applying the ADM","q":"Complete the sentence: The levels of the Architecture Landscape are Strategic, Segment, and …","options":["Capability.","Enterprise.","Solution.","Transition."],"correct":0,"explain":"The TOGAF framework uses the concept of the Architecture Landscape to refer to the complete set of descriptions for the Enterprise Architecture. The levels of the Architecture Landscape are Strategic, Segment, and Capability.","qEs":"Complete la oración: Los niveles del Architecture Landscape son Strategic, Segment y …","optionsEs":["Capability.","Enterprise.","Solution.","Transition."],"explainEs":"El framework de TOGAF usa el concepto de Architecture Landscape para referirse al conjunto completo de descripciones de la Enterprise Architecture. Los niveles del Architecture Landscape son Strategic, Segment y Capability."},{"unit":5,"unitName":"Unit 5 — Applying the ADM","q":"Why does partitioning help simplify the development of an Enterprise Architecture?","options":["It is designed to support organizations with more than 75 architects.","To enable different teams to work on different elements of an architecture.","To match the levels and concepts of the Architecture Continuum.","By providing a standard partitioning model for adoption."],"correct":1,"explain":"Different teams need to work on different elements of architecture at the same time; partitions allow specific groups of architects to own and develop specific elements of the architecture.","qEs":"¿Por qué ayuda el particionamiento (partitioning) a simplificar el desarrollo de una Enterprise Architecture?","optionsEs":["Está diseñado para apoyar organizaciones con más de 75 arquitectos.","Para permitir que distintos equipos trabajen en distintos elementos de una arquitectura.","Para calzar con los niveles y conceptos del Architecture Continuum.","Al ofrecer un modelo de particionamiento estándar para adoptar."],"explainEs":"Distintos equipos necesitan trabajar en distintos elementos de la arquitectura al mismo tiempo; las particiones permiten que grupos específicos de arquitectos posean y desarrollen elementos específicos de la arquitectura."},{"unit":5,"unitName":"Unit 5 — Applying the ADM","q":"Complete the sentence: The four purposes of Enterprise Architecture that can be used to frame the planning horizon, depth, and breadth of an Architecture Project, and the contents of the Enterprise Architecture Repository, are Architecture to Support Strategy, Portfolio, Project, and …","options":["Capability.","Enterprise.","Segment.","Solution Delivery."],"correct":3,"explain":"The four purposes of Enterprise Architecture are Strategy, Portfolio, Project, and Solution Delivery.","qEs":"Complete la oración: Los cuatro propósitos de la Enterprise Architecture que pueden usarse para enmarcar el horizonte de planificación, la profundidad y la amplitud de un Architecture Project, y el contenido del Enterprise Architecture Repository, son Architecture to Support Strategy, Portfolio, Project, y …","optionsEs":["Capability.","Enterprise.","Segment.","Solution Delivery."],"explainEs":"Los cuatro propósitos de la Enterprise Architecture son Strategy, Portfolio, Project y Solution Delivery."},{"unit":6,"unitName":"Unit 6 — Architecture Governance","q":"Which of the following is a responsibility of an Architecture Board?","options":["Allocating resources for architecture projects","Conducting assessments of the maturity level of architecture discipline within the organization","Decision rights about Target Architectures","Establishing targets for re-use of components"],"correct":3,"explain":"One of the responsibilities of the Architecture Board is establishing targets for re-use of components.","qEs":"¿Cuál de las siguientes es una responsabilidad de un Architecture Board?","optionsEs":["Asignar recursos para proyectos de arquitectura","Realizar evaluaciones del nivel de madurez de la disciplina de arquitectura dentro de la organización","Derechos de decisión sobre las Target Architectures","Establecer metas para la reutilización de componentes"],"explainEs":"Una de las responsabilidades del Architecture Board es establecer metas para la reutilización de componentes."},{"unit":6,"unitName":"Unit 6 — Architecture Governance","q":"What is the practice by which Enterprise Architectures are managed and controlled at an enterprise-wide level?","options":["Architecture Governance","Corporate Governance","IT Governance","Technology Governance"],"correct":0,"explain":"Architecture Governance is the practice and orientation by which Enterprise Architectures and other architectures are managed and controlled at an enterprise-wide level.","qEs":"¿Cuál es la práctica mediante la cual las Enterprise Architectures se gestionan y controlan a nivel de toda la empresa?","optionsEs":["Architecture Governance","Corporate Governance","IT Governance","Technology Governance"],"explainEs":"Architecture Governance es la práctica y orientación mediante la cual las Enterprise Architectures y otras arquitecturas se gestionan y controlan a nivel de toda la empresa."},{"unit":6,"unitName":"Unit 6 — Architecture Governance","q":"When considering Architecture Governance, what is the benefit that derives from transparency?","options":["Actions implemented and their decision support will be available for inspection","All parties will have a commitment to adhere to procedures and process","All decision-making will be established so as to minimize conflicts of interest","Groups within the organization are accountable for their actions."],"correct":0,"explain":"Transparency — all actions implemented and their decision support will be available for inspection by authorized organization and provider parties.","qEs":"Al considerar Architecture Governance, ¿cuál es el beneficio que se deriva de la transparencia?","optionsEs":["Las acciones implementadas y su sustento de decisión estarán disponibles para inspección","Todas las partes tendrán el compromiso de cumplir con los procedimientos y procesos","Toda la toma de decisiones se establecerá de modo que minimice los conflictos de interés","Los grupos dentro de la organización serán responsables de sus acciones."],"explainEs":"Transparencia — todas las acciones implementadas y su sustento de decisión estarán disponibles para inspección por parte de las partes autorizadas de la organización y del proveedor."},{"unit":7,"unitName":"Unit 7 — Architecture Content","q":"Complete the sentence by selecting the applicable pair of words: A(n) … is a representation of a system from the perspective of a(n) …","options":["architecture view, related set of concerns.","architecture viewpoint, architecture view.","concern, architecture view.","architecture, set of elements."],"correct":0,"explain":"An architecture view is a representation of a system from the perspective of a related set of concerns.","qEs":"Complete la oración eligiendo el par de palabras aplicable: Un(a) … es una representación de un sistema desde la perspectiva de un(a) …","optionsEs":["architecture view, conjunto relacionado de concerns.","architecture viewpoint, architecture view.","concern, architecture view.","architecture, conjunto de elementos."],"explainEs":"Un architecture view es una representación de un sistema desde la perspectiva de un conjunto relacionado de concerns."},{"unit":7,"unitName":"Unit 7 — Architecture Content","q":"Which of the following best describes the purpose of the Request for Architecture Work?","options":["It defines the scope and approach to complete an architecture development cycle.","It is sent from the sponsor and triggers the start of an architecture development cycle.","It provides a high-level aspirational view of the end architecture project.","It provides a schedule for implementation of the Target Architecture."],"correct":1,"explain":"The Request for Architecture Work document is sent from the sponsoring organization to the architecture organization to trigger the start of an architecture development cycle.","qEs":"¿Cuál de las siguientes describe mejor el propósito del Request for Architecture Work?","optionsEs":["Define el alcance y el enfoque para completar un ciclo de desarrollo de arquitectura.","Se envía desde el sponsor y da inicio a un ciclo de desarrollo de arquitectura.","Ofrece una visión aspiracional de alto nivel del proyecto de arquitectura final.","Ofrece un cronograma para la implementación de la Arquitectura Objetivo."],"explainEs":"El documento Request for Architecture Work se envía desde la organización patrocinadora a la organización de arquitectura para dar inicio a un ciclo de desarrollo de arquitectura."},{"unit":7,"unitName":"Unit 7 — Architecture Content","q":"Which of the following is created in Phase A with the purpose to agree at the outset what the desired outcome should be for the architecture, so that architects can then focus on the detail necessary to validate feasibility?","options":["Architecture Roadmap","Architecture Contract","Architecture Principles","Architecture Vision"],"correct":3,"explain":"The Architecture Vision is created in Phase A and provides a high-level summary of the changes to the enterprise that will follow from the successful deployment of the Target Architecture.","qEs":"¿Cuál de las siguientes se crea en la Fase A con el propósito de acordar desde el inicio cuál debería ser el resultado deseado para la arquitectura, de modo que los arquitectos puedan enfocarse en el detalle necesario para validar la viabilidad?","optionsEs":["Architecture Roadmap","Architecture Contract","Architecture Principles","Architecture Vision"],"explainEs":"La Architecture Vision se crea en la Fase A y ofrece un resumen de alto nivel de los cambios a la empresa que resultarán del despliegue exitoso de la Arquitectura Objetivo. Su propósito es acordar desde el inicio cuál debería ser el resultado deseado para la arquitectura, de modo que los arquitectos puedan enfocarse en el detalle necesario para validar la viabilidad."},{"unit":7,"unitName":"Unit 7 — Architecture Content","q":"Which of the following is a package of functionality defined to meet business needs across an organization?","options":["Architecture Description","Building block","Model Kind","System"],"correct":1,"explain":"A building block is a package of functionality defined to meet the business needs across an organization. It may interoperate with other, inter-dependent building blocks.","qEs":"¿Cuál de las siguientes es un paquete de funcionalidad definido para satisfacer necesidades de negocio en toda una organización?","optionsEs":["Architecture Description","Building block","Model Kind","System"],"explainEs":"Un building block es un paquete de funcionalidad definido para satisfacer las necesidades de negocio en toda una organización. Puede interoperar con otros building blocks interdependientes."}];

{
  id:"niveles", title:"Niveles y dimensiones de arquitectura",
  html:`<p style="margin:2px 0 4px;color:var(--ink-soft);">El alcance de una arquitectura (Architecture Landscape) se mide en tres dimensiones:</p>
  <table class="ref-table"><tr><th>Dimensión</th><th>Qué representa</th><th>Cómo se interpreta</th></tr>
  <tr><td class="rf-name">Breadth (alcance)</td><td>Qué parte de la empresa está cubierta</td><td>Toda la empresa, un segmento o una capacidad específica</td></tr>
  <tr><td class="rf-name">Level (nivel)</td><td>Qué tan estratégico o detallado es el contenido</td><td>Alto = estratégico/conceptual; medio = estructural; bajo = detallado</td></tr>
  <tr><td class="rf-name">Time (tiempo)</td><td>Horizonte temporal de la arquitectura</td><td>Baseline (AS-IS), Transition (intermedio) o Target (TO-BE)</td></tr>
  </table>
  <p style="margin:14px 0 4px;color:var(--ink-soft);">Los tres niveles de Architecture Landscape:</p>
  <div class="ref-grid">
    <div class="ref-pill"><div class="pt">Enterprise Strategic</div>Dirección estratégica y lineamientos globales. Ej: "el banco será 100% digital en originación".</div>
    <div class="ref-pill"><div class="pt">Segment Architecture</div>Traduce la estrategia a un área o línea de negocio. Ej: arquitectura del segmento de Créditos.</div>
    <div class="ref-pill"><div class="pt">Capability Architecture</div>Diseño detallado de una capacidad puntual. Ej: arquitectura del motor de Scoring.</div>
  </div>`
},
{
  id:"iteracion", title:"Tipos de iteración en el ADM",
  html:`<table class="ref-table"><tr><th>Tipo</th><th>Qué significa</th><th>Por qué ocurre</th></tr>

  <tr><td class="rf-name">Entre fases</td><td>Se regresa a una fase anterior por algo detectado después</td><td>Inconsistencias descubiertas en fases posteriores</td></tr>
  <tr><td class="rf-name">Ciclo completo del ADM</td><td>Se vuelve a ejecutar todo el ciclo para evolucionar la arquitectura</td><td>Cambio estratégico o nueva iniciativa</td></tr>
  <tr><td class="rf-name">Por nivel estratégico</td><td>Se aplica el ADM a nivel corporativo</td><td>Alinear arquitectura con la estrategia institucional</td></tr>

  <tr><td class="rf-name">Por capacidad</td><td>Se aplica el ADM a una capacidad puntual</td><td>Se requiere mayor detalle técnico y funcional</td></tr>

{
  id:"governance", title:"Architecture Governance",

const STORE_KEY = "togaf_prep_history_v1";
function loadHistory(){
  try{

    return raw ? JSON.parse(raw) : {exam:[], day:{}, general:[]};
  }catch(e){ return {exam:[], day:{}, general:[]}; }
}
function saveHistory(h){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(h)); }catch(e){}
}
let HISTORY = loadHistory();

function loadTheme(){
  try{ return localStorage.getItem("togaf_prep_theme") || "auto"; }catch(e){ return "auto"; }
}
function saveTheme(t){
  try{ localStorage.setItem("togaf_prep_theme", t); }catch(e){}
}
function applyTheme(){
  const t = loadTheme();
  if(t === "auto"){ document.documentElement.removeAttribute("data-theme"); }
  else{ document.documentElement.setAttribute("data-theme", t); }
}
applyTheme();

// Returns the question text/options/explain in the currently selected language,
// falling back to English when no Spanish translation is stored on that item.
function qText(q){ return loadLang() === "es" && q.qEs ? q.qEs : q.q; }
function qOptions(q){ return loadLang() === "es" && q.optionsEs ? q.optionsEs : q.options; }
function qExplain(q){ return loadLang() === "es" ? (q.explainEs !== undefined ? q.explainEs : q.explain) : q.explain; }

// ---------- utils ----------
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function letterFor(i){ return String.fromCharCode(65+i); }
function fmtTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return m+":"+String(s).padStart(2,"0");
}
function dedupeById(list){
  const seen = new Set(); const out=[];
  for(const q of list){ if(!seen.has(q.q)){ seen.add(q.q); out.push(q); } }
  return out;
}
const ALL_PRACTICE_UNIQUE = dedupeById(PRACTICE_QUESTIONS);
const ALL_POOL_UNIQUE = dedupeById(EXAM_QUESTIONS.concat(ALL_PRACTICE_UNIQUE).concat(OFFICIAL_QUESTIONS));

// ---------- app state / router ----------
const app = document.getElementById("app");
let ROUTE = {view:"home"};
let QUIZ = null; // active quiz state

function go(route){ ROUTE = route; render(); window.scrollTo({top:0, behavior:"instant"}); }

// ---------- quiz engine ----------
function startQuiz(opts){
  // opts: {questions, mode: 'exam'|'practice', label, timeLimitSec, dayKey}
  const questions = opts.randomize === false ? opts.questions : shuffle(opts.questions);
  QUIZ = {
    mode: opts.mode,
    label: opts.label,
    dayKey: opts.dayKey || null,
    questions: questions,
    idx: 0,
    answers: new Array(questions.length).fill(null),
    revealed: new Array(questions.length).fill(false),
    timeLimitSec: opts.timeLimitSec || null,
    remaining: opts.timeLimitSec || null,
    startedAt: Date.now(),
    timerHandle: null
  };
  if(QUIZ.timeLimitSec){
    QUIZ.timerHandle = setInterval(()=>{
      QUIZ.remaining--;
      if(QUIZ.remaining <= 0){
        clearInterval(QUIZ.timerHandle);
        QUIZ.remaining = 0;
        finishQuiz();
        return;
      }
      const t = document.getElementById("timerDisplay");
      if(t){
        t.textContent = fmtTime(QUIZ.remaining);
        t.classList.toggle("low", QUIZ.remaining <= 120);
      }
    },1000);
  }
  go({view:"quiz"});
}

function selectAnswer(i){
  if(QUIZ.revealed[QUIZ.idx]) return;
  QUIZ.answers[QUIZ.idx] = i;
  if(QUIZ.mode === "practice"){
    QUIZ.revealed[QUIZ.idx] = true;
  }
  renderQuizBody();
}

function nextQuestion(){
  if(QUIZ.idx < QUIZ.questions.length - 1){
    QUIZ.idx++;
    render();
  } else {
    finishQuiz();
  }
}
function prevQuestion(){
  if(QUIZ.idx > 0){ QUIZ.idx--; render(); }
}

function finishQuiz(){
  if(QUIZ.timerHandle) clearInterval(QUIZ.timerHandle);
  let score = 0;
  QUIZ.questions.forEach((q,i)=>{ if(QUIZ.answers[i] === q.correct) score++; });
  QUIZ.score = score;
  QUIZ.finishedAt = Date.now();

  const entry = {
    date: new Date().toISOString(),
    score: score,
    total: QUIZ.questions.length,
    seconds: Math.round((QUIZ.finishedAt - QUIZ.startedAt)/1000)
  };
  if(QUIZ.mode === "exam"){
    HISTORY.exam.unshift(entry);
    HISTORY.exam = HISTORY.exam.slice(0,8);
  } else if(QUIZ.dayKey){
    if(!HISTORY.day[QUIZ.dayKey]) HISTORY.day[QUIZ.dayKey] = [];
    HISTORY.day[QUIZ.dayKey].unshift(entry);
    HISTORY.day[QUIZ.dayKey] = HISTORY.day[QUIZ.dayKey].slice(0,5);
  } else {
    HISTORY.general.unshift(entry);
    HISTORY.general = HISTORY.general.slice(0,8);
  }
  saveHistory(HISTORY);
  go({view:"results"});
}

function retryWrongOnly(){
  const wrong = [];
  QUIZ.questions.forEach((q,i)=>{ if(QUIZ.answers[i] !== q.correct) wrong.push(q); });
  if(wrong.length === 0) return;
  startQuiz({questions:wrong, mode:"practice", label:"Repaso de fallos · " + QUIZ.label, randomize:true});
}

}

function bestOf(list){
  if(!list || list.length===0) return null;
  return list.reduce((best,e)=> (e.score/e.total > best.score/best.total ? e : best), list[0]);
}

function renderHistoryRows(){
  const rows = [];
  HISTORY.exam.slice(0,3).forEach(e=> rows.push({label:"Examen simulado", e}));
  HISTORY.general.slice(0,2).forEach(e=> rows.push({label:"Repaso mezclado", e}));
  Object.keys(HISTORY.day).forEach(k=>{
    const e = HISTORY.day[k][0];
    if(e) rows.push({label:"Día " + k + " — " + (DAY_META[k]?DAY_META[k].title:""), e});
  });
  rows.sort((a,b)=> new Date(b.e.date) - new Date(a.e.date));
  if(rows.length === 0) return `<div class="empty">Todavía no hiciste ningún intento. Arrancá con el modo que prefieras.</div>`;
  return rows.slice(0,6).map(r=>{
    const pct = Math.round(100*r.e.score/r.e.total);
    return `<div class="row"><span>${r.label}</span><span class="mono">${r.e.score}/${r.e.total} · ${pct}%</span></div>`;
  }).join("");
}

    <button class="back-link" onclick="go({view:'home'})">← Volver</button>
    <div class="section-title">Preguntas oficiales del curso</div>
    <div class="section-desc">Las preguntas de "Unit Test" tal como aparecen en el material oficial del curso, unidad por unidad.</div>
    <div class="daylist">
      ${UNIT_ORDER.map(u=>{
        const qs = OFFICIAL_QUESTIONS.filter(q=>q.unit===u);
        const best = bestOf(HISTORY.day["u"+u]);
        return `<div class="day-row" onclick="openUnit(${u})">
          <div class="day-badge">${u}</div>
          <div>
            <div class="dtitle">${UNIT_META[u]}</div>
            <div class="dcount">${qs.length} pregunta${qs.length===1?'':'s'}</div>
          </div>
          ${best ? `<div class="dbest">${best.score}/${best.total}</div>` : ""}
        </div>`;
      }).join("")}
    </div>
  `;
}
function openUnit(u){
  const qs = OFFICIAL_QUESTIONS.filter(q=>q.unit===u);
  startQuiz({questions:qs, mode:"practice", label:"Unit " + u + " — " + UNIT_META[u], dayKey:"u"+u});
}

function renderGeneralPicker(){
  const pool = ALL_POOL_UNIQUE.length;
  app.innerHTML = `
    ${topbar()}
    <button class="back-link" onclick="go({view:'home'})">← Volver</button>
    <div class="section-title">Repaso mezclado</div>
    <div class="section-desc">Preguntas al azar de todo el banco (${pool} en total), con corrección inmediata. Elegí cuántas querés.</div>
    <div class="count-picker">
      ${[10,20,30,pool].map(n=> `<button onclick="openGeneral(${n})">${n===pool? 'Todas ('+pool+')' : n + ' preguntas'}</button>`).join("")}
    </div>
  `;
}
function openGeneral(n){
  const pool = shuffle(ALL_POOL_UNIQUE);
  const qs = pool.slice(0, n);
  startQuiz({questions:qs, mode:"practice", label:"Repaso mezclado (" + n + ")"});
}

function renderReference(){
  app.innerHTML = `
    ${topbar()}
    <button class="back-link" onclick="go({view:'home'})">← Volver</button>
    <div class="section-title">Chuleta de repaso</div>
    <div class="section-desc">Resumen en español de tu material — tocá cada sección para abrirla.</div>
    <div id="refList">
      ${REFERENCE.map((s,i)=>`
        <div class="ref-section" id="ref-${s.id}">
          <div class="ref-head" onclick="toggleRef('${s.id}')">
            <div class="rbadge">${String(i+1).padStart(2,'0')}</div>
            <h3>${s.title}</h3>
            <div class="chev">›</div>
          </div>
          <div class="ref-body">${loadLang()==='es' && s.htmlEs ? s.htmlEs : s.html}</div>
        </div>
      `).join("")}
    </div>
    <footer class="note">Contenido tomado de tu resumen del Ciclo ADM (Excel) y del glosario oficial del curso</footer>
  `;
}
function toggleRef(id){
  const el = document.getElementById('ref-'+id);
  if(el) el.classList.toggle('open');
}

function renderQuiz(){
  app.innerHTML = `
    ${topbar()}
    <button class="back-link" onclick="confirmExit()">← Salir</button>
    <div id="quizBody"></div>
  `;
  renderQuizBody();
}
function confirmExit(){
  if(confirm("¿Salir del intento actual? No se va a guardar el puntaje.")){
    if(QUIZ && QUIZ.timerHandle) clearInterval(QUIZ.timerHandle);
    go({view:"home"});
  }
}

function renderQuizBody(){
  const body = document.getElementById("quizBody");
  if(!body) return;
  const q = QUIZ.questions[QUIZ.idx];
  const selected = QUIZ.answers[QUIZ.idx];
  const revealed = QUIZ.revealed[QUIZ.idx];
  const pct = Math.round(100*(QUIZ.idx)/QUIZ.questions.length);

  const optsList = qOptions(q);
  const optsHtml = optsList.map((opt,i)=>{
    let cls = "opt";
    if(revealed){
      cls += " disabled";
      if(i === q.correct) cls += " correct";
      else if(i === selected) cls += " incorrect";
    } else if(i === selected){
      cls += " selected";
    }
    return `<div class="${cls}" onclick="selectAnswer(${i})">
      <div class="letter">${letterFor(i)}</div>
      <div>${opt}</div>
    </div>`;
  }).join("");

  let feedbackHtml = "";
  if(revealed){
    const ok = selected === q.correct;
    const explainTxt = qExplain(q);
    feedbackHtml = `<div class="feedback ${ok?'ok':'bad'}">
      <b>${ok ? 'Correcto' : 'Incorrecto'}</b> — la respuesta es "${letterFor(q.correct)}. ${optsList[q.correct]}"
      ${explainTxt ? `<div class="explain">${explainTxt}</div>` : ""}
    </div>`;
  }

  body.innerHTML = `
    <div class="quiz-head">
      <div class="progress-wrap">
        <div class="progress-label"><span>${QUIZ.label}</span><span>Pregunta ${QUIZ.idx+1} de ${QUIZ.questions.length}</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
      ${QUIZ.timeLimitSec ? `<div class="timer ${QUIZ.remaining<=120?'low':''}" id="timerDisplay">${fmtTime(QUIZ.remaining)}</div>` : ""}
    </div>
    <div class="qcard">
      <div class="qtag">Pregunta ${QUIZ.idx+1}</div>
      <p class="qtext">${qText(q)}</p>
      <div class="options">${optsHtml}</div>
      ${feedbackHtml}
    </div>
    <div class="quiz-actions">
      ${QUIZ.idx>0 ? `<button class="btn ghost" onclick="prevQuestion()">Anterior</button>` : ""}
      <button class="btn" id="nextBtn" ${(QUIZ.mode==='practice' && !revealed) || (QUIZ.mode==='exam' && selected===null && false) ? 'disabled' : ''} onclick="nextQuestion()">
        ${QUIZ.idx === QUIZ.questions.length-1 ? 'Finalizar' : 'Siguiente'}
      </button>
    </div>
  `;

  if(QUIZ.mode === 'practice'){
    const nb = document.getElementById('nextBtn');
    if(nb) nb.disabled = !revealed;
  }
}

function renderResults(){
  const pct = Math.round(100*QUIZ.score/QUIZ.questions.length);
  const pass = pct >= 55;
  const wrongCount = QUIZ.questions.length - QUIZ.score;

  const reviewHtml = QUIZ.questions.map((q,i)=>{
    const sel = QUIZ.answers[i];
    const ok = sel === q.correct;
    if(ok) return "";
    const opts = qOptions(q);
    const explainTxt = qExplain(q);
    return `<div class="review-item">
      <div class="rq">${i+1}. ${qText(q)}</div>
      <div class="ra wrong">${sel!==null ? letterFor(sel)+'. '+opts[sel] : '(sin responder)'}</div>
      <div class="ra correct">${letterFor(q.correct)}. ${opts[q.correct]}</div>
      ${explainTxt ? `<div class="explain">${explainTxt}</div>` : ""}
    </div>`;
  }).join("");

  app.innerHTML = `
    ${topbar()}
    <div class="section-title">Resultado — ${QUIZ.label}</div>
    <div class="score-wrap">
      <div class="score-ring ${pass?'pass':'fail'}">${pct}%</div>
      <div class="score-info">
        <h3>${QUIZ.score} / ${QUIZ.questions.length} correctas</h3>
        <p>${pass ? 'Vas bien encaminado — seguí reforzando lo que falló.' : 'Todavía falta repaso. Enfocate en las preguntas falladas abajo.'}</p>
        <div class="pct">tiempo: ${fmtTime(Math.round((QUIZ.finishedAt-QUIZ.startedAt)/1000))} · ${wrongCount} para repasar</div>
      </div>
    </div>

    <div class="result-actions">
      ${wrongCount>0 ? `<button class="btn" onclick="retryWrongOnly()">Repasar solo los fallados (${wrongCount})</button>` : ""}
      <button class="btn ghost" onclick="go({view:'home'})">Volver al inicio</button>
    </div>

    ${wrongCount>0 ? `<div class="section-title" style="margin-top:30px;font-size:17px;">Revisión de errores</div>
    <div class="review-list">${reviewHtml}</div>` : `<p style="margin-top:24px;color:var(--ink-soft);">¡Todas correctas! No hay nada para repasar en este intento.</p>`}
  `;
}

render();
</script>
</body>
</html>
